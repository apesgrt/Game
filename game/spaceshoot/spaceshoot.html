<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#030712">
  <title>Space Shoot</title>
  <link rel="stylesheet" href="spaceshoot.css">
  <script>
    (() => {
      const block = event => event.preventDefault();
      document.addEventListener('gesturestart', block, { passive: false });
      document.addEventListener('gesturechange', block, { passive: false });
      document.addEventListener('wheel', event => {
        if (event.ctrlKey) event.preventDefault();
      }, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchend', event => {
        const now = Date.now();
        if (now - lastTouchEnd <= 330) event.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
    })();
  </script>
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15.8 4.2a1 1 0 0 1 0 1.4L10.4 11H20a1 1 0 1 1 0 2h-9.6l5.4 5.4a1 1 0 0 1-1.4 1.4l-7.1-7.1a1 1 0 0 1 0-1.4l7.1-7.1a1 1 0 0 1 1.4 0Z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.7c0-1.4 1.6-2.2 2.8-1.4l8.4 5.8c1.1.8 1.1 2.4 0 3.2l-8.4 5.8C9.6 19.9 8 19.1 8 17.7v-12Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5.5A1.5 1.5 0 0 1 8.5 4h1A1.5 1.5 0 0 1 11 5.5v13A1.5 1.5 0 0 1 9.5 20h-1A1.5 1.5 0 0 1 7 18.5v-13Zm6 0A1.5 1.5 0 0 1 14.5 4h1A1.5 1.5 0 0 1 17 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-1a1.5 1.5 0 0 1-1.5-1.5v-13Z"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><path d="M12 3c5 0 9 2 9 4.6v8.8C21 19 17 21 12 21s-9-2-9-4.6V7.6C3 5 7 3 12 3Zm0 2C7.9 5 5 6.4 5 7.6S7.9 10.2 12 10.2s7-1.4 7-2.6S16.1 5 12 5Zm7 5.4c-1.7 1.1-4.2 1.8-7 1.8s-5.3-.7-7-1.8v2.1c0 1.2 2.9 2.6 7 2.6s7-1.4 7-2.6v-2.1Zm0 5c-1.7 1.1-4.2 1.7-7 1.7s-5.3-.6-7-1.7v1c0 1.2 2.9 2.6 7 2.6s7-1.4 7-2.6v-1Z"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.7 2.4a1 1 0 0 1 .5 1.2L12.6 10H18a1 1 0 0 1 .8 1.6l-8 10a1 1 0 0 1-1.8-.9l1.6-6.7H6a1 1 0 0 1-.9-1.5l7-10a1 1 0 0 1 1.6-.1Z"/></symbol>
    <symbol id="i-fire" viewBox="0 0 24 24"><path d="M13.2 2.4a1 1 0 0 0-1.5.8c0 2.2-1.2 3.4-2.7 4.8-1.8 1.6-4 3.6-4 7.2C5 19 8.1 22 12 22s7-3 7-6.8c0-3.4-1.6-5.5-3.2-7.4-.8-1-1.6-2-2.1-3.3-.1-.3-.3-.7-.5-1.1Zm-.8 16.8c-1.8 0-3.2-1.3-3.2-3 0-1.5.9-2.5 1.9-3.6.7-.8 1.5-1.6 1.9-2.8.4.8.9 1.5 1.5 2.2 1 1.2 1.9 2.3 1.9 4.1 0 1.8-1.8 3.1-4 3.1Z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12.4 2.1a1 1 0 0 0-.8 0L5.4 4.7a1 1 0 0 0-.6.9v5.8c0 5.2 3.2 8.6 6.8 10.4.3.2.6.2.9 0 3.6-1.8 6.8-5.2 6.8-10.4V5.6a1 1 0 0 0-.6-.9l-6.3-2.6ZM7 6.3l5-2.1 5 2.1v5.1c0 4-2.3 6.7-5 8.2-2.7-1.5-5-4.2-5-8.2V6.3Z"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><path d="M12 2a1 1 0 0 1 1 1v1.1a8 8 0 0 1 6.9 6.9H21a1 1 0 1 1 0 2h-1.1a8 8 0 0 1-6.9 6.9V21a1 1 0 1 1-2 0v-1.1A8 8 0 0 1 4.1 13H3a1 1 0 1 1 0-2h1.1A8 8 0 0 1 11 4.1V3a1 1 0 0 1 1-1Zm0 4a6 6 0 1 0 0 12 6 6 0 0 0 0-12Zm0 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M7 10V8a5 5 0 0 1 10 0v2h1a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h1Zm2 0h6V8a3 3 0 1 0-6 0v2Zm3 4a1.5 1.5 0 0 0-1 2.6V18a1 1 0 1 0 2 0v-1.4a1.5 1.5 0 0 0-1-2.6Z"/></symbol>
    <symbol id="i-boss" viewBox="0 0 24 24"><path d="M12 2 2 20h20L12 2Zm0 5.2 6.4 10.8H5.6L12 7.2ZM11 10h2v5h-2v-5Zm0 6.5h2v2h-2v-2Z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.8 11.3 4a1 1 0 0 1 1.4 0L20 10.8a1 1 0 0 1-1.4 1.5l-.6-.6V19a2 2 0 0 1-2 2h-2.5a1 1 0 0 1-1-1v-4h-1v4a1 1 0 0 1-1 1H8a2 2 0 0 1-2-2v-7.3l-.6.6A1 1 0 0 1 4 10.8Z"/></symbol>
  </svg>

  <main id="menu" class="screen" aria-label="Menu Space Shoot">
    <section class="panel">
      <div class="menu-top">
        <button class="icon-btn" type="button" onclick="goBack()" aria-label="Kembali ke home">
          <svg><use href="#i-back"></use></svg>
        </button>
        <div class="title-wrap">
          <p class="eyebrow">RaffzGames</p>
          <h1>SPACE SHOOT</h1>
        </div>
        <span class="top-spacer" aria-hidden="true"></span>
      </div>

      <p class="sub">Pilih kapal, upgrade senjata, lawan boss, dan kumpulkan skor tertinggi.</p>

      <div class="coin-box">
        <div class="coin-chip">
          <svg><use href="#i-coin"></use></svg>
          <span id="coinText">0</span>
        </div>
      </div>

      <div class="section-title">Pilih Kapal</div>
      <div class="ships" id="shipList"></div>

      <div class="section-title"><span id="upgSec">Upgrade</span></div>
      <div class="upgrades">
        <button class="upg-btn" type="button" onclick="buyUpgrade('damage')">
          <span class="upg-head"><svg><use href="#i-bolt"></use></svg>Damage</span>
          <span class="upg-sub" id="damageText"></span>
          <span class="upg-bar" id="damagePips" style="--acc:#67e8f9"></span>
        </button>
        <button class="upg-btn" type="button" onclick="buyUpgrade('fire')">
          <span class="upg-head"><svg><use href="#i-fire"></use></svg>Fire Rate</span>
          <span class="upg-sub" id="fireText"></span>
          <span class="upg-bar" id="firePips" style="--acc:#fb923c"></span>
        </button>
        <button class="upg-btn" type="button" onclick="buyUpgrade('hp')">
          <span class="upg-head"><svg><use href="#i-shield"></use></svg>Max HP</span>
          <span class="upg-sub" id="hpTextMenu"></span>
          <span class="upg-bar" id="hpPips" style="--acc:#22c55e"></span>
        </button>
        <button class="upg-btn" type="button" onclick="buyUpgrade('coin')">
          <span class="upg-head"><svg><use href="#i-coin"></use></svg>Coin Bonus</span>
          <span class="upg-sub" id="coinBonusText"></span>
          <span class="upg-bar" id="coinPips" style="--acc:#facc15"></span>
        </button>
      </div>

      <button class="play-btn" type="button" onclick="startGame()">
        <svg><use href="#i-play"></use></svg>
        Mulai Misi
      </button>
      <p class="hint">Kontrol: sentuh/seret layar, mouse, tombol WASD/arrow, ESC untuk pause.</p>
    </section>
  </main>

  <canvas id="game" aria-label="Area game Space Shoot"></canvas>

  <header id="hud" aria-live="polite">
    <button class="hud-btn" type="button" onclick="goBack()" aria-label="Kembali ke home">
      <svg><use href="#i-back"></use></svg>
    </button>
    <div class="hp-wrap">
      <span class="hp-lbl">HP</span>
      <div class="hp-track"><div class="hp-fill" id="hpFill"></div></div>
      <span class="hp-num" id="hudHp">0/0</span>
    </div>
    <div class="hud-mid" id="hudScore">Score 0</div>
    <button class="hud-btn" id="pauseBtn" type="button" onclick="togglePause()" aria-label="Pause">
      <svg><use href="#i-pause"></use></svg>
    </button>
  </header>

  <aside id="bossBar" aria-live="polite">
    <div class="boss-top">
      <span class="boss-lbl"><svg><use href="#i-boss"></use></svg>BOSS</span>
      <span class="boss-hp-num" id="bossHpNum"></span>
    </div>
    <div class="boss-track"><div class="boss-fill" id="bossFill"></div></div>
  </aside>

  <section id="endScreen" class="screen" style="display:none" aria-label="Hasil permainan">
    <div class="panel end-panel">
      <h2 id="endTitle">GAME OVER</h2>
      <div id="endStats" class="end-stats"></div>
      <div class="end-coins" id="endCoins"></div>
      <button class="play-btn" type="button" onclick="backToMenu()">
        <svg><use href="#i-home"></use></svg>
        Menu Game
      </button>
    </div>
  </section>

  <script src="spaceshoot.js"></script>
</body>
</html>
