<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mahjong Solitaire</title>
  <link rel="stylesheet" href="mahjong.css" />
</head>
<body>
  <div class="mahjong-app" id="app">
    <header class="game-header">
      <button class="icon-button back-button" id="backBtn" type="button" aria-label="Kembali">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6"/><path d="M10 12h10"/></svg>
      </button>
      <section class="title-card" aria-label="Informasi game">
        <div class="title-kicker">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16"/><path d="M7 5h10"/><path d="M6 8v9a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8"/><path d="M9 12h6"/><path d="M9 15h6"/></svg>
          <span>Table Mode</span>
        </div>
        <h1>Mahjong Solitaire</h1>
        <p id="levelName">Pilih dua ubin bebas yang sama.</p>
      </section>
    </header>

    <section class="stats-grid" aria-label="Statistik permainan">
      <article class="stat-card"><span>Bentuk</span><strong id="levelText">1</strong></article>
      <article class="stat-card"><span>Pair</span><strong id="pairsText">0</strong></article>
      <article class="stat-card"><span>Langkah</span><strong id="movesText">0</strong></article>
      <article class="stat-card"><span>Waktu</span><strong id="timeText">00:00</strong></article>
    </section>

    <section class="controls-grid" aria-label="Kontrol permainan">
      <button class="control-button primary" id="newBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v6h-6"/></svg>
        <span>Baru</span>
      </button>
      <button class="control-button" id="hintBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.74V16h8v-1.26A7 7 0 0 0 12 2Z"/></svg>
        <span>Hint</span>
      </button>
      <button class="control-button" id="shuffleBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3c4 0 5 10 9 10h6"/><path d="m18 14 3 3-3 3"/><path d="M3 17h3c1.8 0 3-1.8 4.1-3.9"/><path d="M14.6 8.1C15.7 7.4 16.8 7 18 7h3"/><path d="m18 4 3 3-3 3"/></svg>
        <span>Shuffle</span>
      </button>
      <button class="control-button" id="nextBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14l9-7-9-7Z"/><path d="M19 5v14"/></svg>
        <span>Next</span>
      </button>
    </section>

    <nav class="level-strip" id="levels" aria-label="Pilih bentuk"></nav>

    <main class="table-scene" id="scene" aria-label="Meja mahjong">
      <span class="table-line top-left"></span>
      <span class="table-line top-right"></span>
      <span class="table-glow"></span>
      <div class="table-mark" aria-hidden="true">
        <svg viewBox="0 0 120 120"><path d="M74 20a42 42 0 1 0 0 80 34 34 0 1 1 0-80Z"/></svg>
      </div>
      <div id="board" class="board" role="group" aria-label="Ubin mahjong"></div>
      <div id="matchPop" class="match-pop" aria-hidden="true">
        <div id="bigA" class="big-tile"></div>
        <div id="bigB" class="big-tile"></div>
        <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i>
      </div>
    </main>

    <footer id="message" class="message" aria-live="polite">Pilih 2 ubin yang sama. Ubin redup masih terkunci.</footer>
  </div>

  <script src="mahjong.js"></script>
</body>
</html>
