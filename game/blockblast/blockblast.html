<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Block Blast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="blockblast.css">
  <script>
  (function(){
    document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});
    document.addEventListener('gesturechange',function(e){e.preventDefault()},{passive:false});
    document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});
    var lastTouchEnd=0;
    document.addEventListener('touchend',function(e){var now=Date.now();if(now-lastTouchEnd<=330)e.preventDefault();lastTouchEnd=now},{passive:false});
  })();
  </script>
</head>
<body>
  <div id="bb-wrap">
    <div id="bb-bg" aria-hidden="true">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <canvas id="bb-canvas"></canvas>

    <header id="bb-hud" aria-label="Statistik">
      <button id="btn-back" class="btn-back" aria-label="Kembali ke menu"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="stat-card stat-grow">
        <span class="stat-label">SKOR</span>
        <span class="stat-value" id="hud-score">0</span>
      </div>
      <div class="stat-card stat-grow stat-right">
        <span class="stat-label">TERBAIK</span>
        <span class="stat-value gold" id="hud-best">0</span>
      </div>
    </header>

    <div id="bb-combo" role="status" aria-live="polite"></div>

    <div id="bb-overlay">
      <div id="screen-start" class="screen">
        <div class="logo-wrap">
          <div class="logo-row">
            <span class="logo-gem" style="--gc:#FF6B6B;--gd:0s">B</span>
            <span class="logo-gem" style="--gc:#FF9A3C;--gd:.06s">L</span>
            <span class="logo-gem" style="--gc:#FFD93D;--gd:.12s">O</span>
            <span class="logo-gem" style="--gc:#6BCB77;--gd:.18s">C</span>
            <span class="logo-gem" style="--gc:#4ECDC4;--gd:.24s">K</span>
          </div>
          <div class="logo-row">
            <span class="logo-gem" style="--gc:#4D96FF;--gd:.30s">B</span>
            <span class="logo-gem" style="--gc:#C77DFF;--gd:.36s">L</span>
            <span class="logo-gem" style="--gc:#FF79C6;--gd:.42s">A</span>
            <span class="logo-gem" style="--gc:#FF6B6B;--gd:.48s">S</span>
            <span class="logo-gem" style="--gc:#FFD93D;--gd:.54s">T</span>
          </div>
        </div>
        <p class="screen-hint">Drag blok ke grid &bull; Isi baris &amp; kolom untuk blast</p>
        <button id="btn-start" class="btn btn-primary"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7-11-7z" fill="currentColor"/></svg><span>MAIN SEKARANG</span></button>
        <button id="btn-back-menu" class="btn btn-ghost"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>MENU</span></button>
      </div>

      <div id="screen-over" class="screen hidden">
        <svg class="over-icon" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4l6.7 16.4L56 13l-7.4 17.3L60 38l-18.2 2.1L44 60 32 44 20 60l2.2-19.9L4 38l11.4-7.7L8 13l17.3 7.4L32 4z" fill="currentColor"/></svg>
        <h2 class="over-title">GAME OVER</h2>
        <div class="final-score" id="final-score">0</div>
        <div class="final-label">SKOR AKHIR</div>
        <div class="record-badge hidden" id="new-record"><svg class="badge-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v2h4v3a4 4 0 0 1-4 4.8A6 6 0 0 1 13 16v2h3v2H8v-2h3v-2a6 6 0 0 1-3-2.2A4 4 0 0 1 4 9V6h4V4zm-2 4v1a2 2 0 0 0 1.2 1.8A8.4 8.4 0 0 1 8 8H6zm12 0a8.4 8.4 0 0 1 .8 2.8A2 2 0 0 0 20 9V8h-2z" fill="currentColor"/></svg><span>REKOR BARU!</span></div>
        <div class="prev-best" id="prev-best"></div>
        <button id="btn-restart" class="btn btn-danger"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M20 4v6h-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>MAIN LAGI</span></button>
        <button id="btn-back-over" class="btn btn-ghost"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>MENU</span></button>
      </div>
    </div>

    <div id="bb-levelflash" aria-hidden="true"></div>
  </div>

  <script src="blockblast.js"></script>
</body>
</html>
