<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RaffzSpace</title>
  <link rel="stylesheet" href="style.css">
<script>
(function(){
  document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});
  document.addEventListener('gesturechange',function(e){e.preventDefault()},{passive:false});
  document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});
  let lastTouchEnd=0;
  document.addEventListener('touchend',function(e){const now=Date.now();if(now-lastTouchEnd<=330)e.preventDefault();lastTouchEnd=now},{passive:false});
})();
</script>
</head>
<body>

  <!-- ── MENU ───────────────────────────────── -->
  <div id="menu" class="screen">
    <div class="panel">
      <div class="menu-top">
        <button class="back-btn" onclick="goBack()">←</button>
        <h1>RAFFZSPACE</h1>
        <div style="width:38px"></div>
      </div>
      <p class="sub">Pilih kapal · Upgrade · Hadapi boss · Raih skor tertinggi</p>

      <div class="coin-box">
        <div class="coin">🪙 <span id="coinText">0</span></div>
      </div>

      <div class="sec">Pilih Kapal</div>
      <div class="ships" id="shipList"></div>

      <div class="sec"><span id="upgSec">Upgrade</span></div>
      <div class="upgrades">
        <button class="upg-btn" onclick="buyUpgrade('damage')">
          ⚡ Damage
          <span class="upg-sub" id="damageText"></span>
          <div class="upg-bar" id="damagePips" style="--acc:#67e8f9"></div>
        </button>
        <button class="upg-btn" onclick="buyUpgrade('fire')">
          🔥 Fire Rate
          <span class="upg-sub" id="fireText"></span>
          <div class="upg-bar" id="firePips" style="--acc:#fb923c"></div>
        </button>
        <button class="upg-btn" onclick="buyUpgrade('hp')">
          🛡️ Max HP
          <span class="upg-sub" id="hpTextMenu"></span>
          <div class="upg-bar" id="hpPips" style="--acc:#22c55e"></div>
        </button>
        <button class="upg-btn" onclick="buyUpgrade('coin')">
          💰 Coin Bonus
          <span class="upg-sub" id="coinBonusText"></span>
          <div class="upg-bar" id="coinPips" style="--acc:#facc15"></div>
        </button>
      </div>

      <button class="play-btn" onclick="startGame()">▶ MULAI MISI</button>
      <p class="hint">Sentuh/seret layar · ESC untuk pause</p>
    </div>
  </div>

  <!-- ── CANVAS ─────────────────────────────── -->
  <canvas id="game"></canvas>

  <!-- ── HUD ───────────────────────────────── -->
  <div id="hud">
    <button class="hud-btn" onclick="goBack()">←</button>
    <div class="hp-wrap">
      <span class="hp-lbl">HP</span>
      <div class="hp-track"><div class="hp-fill" id="hpFill"></div></div>
      <span class="hp-num" id="hudHp">—</span>
    </div>
    <div class="hud-mid" id="hudScore">—</div>
    <button class="hud-btn" id="pauseBtn" onclick="togglePause()">⏸</button>
  </div>

  <!-- ── BOSS BAR ───────────────────────────── -->
  <div id="bossBar">
    <div class="boss-top">
      <span class="boss-lbl">⚠ BOSS</span>
      <span class="boss-hp-num" id="bossHpNum"></span>
    </div>
    <div class="boss-track"><div class="boss-fill" id="bossFill"></div></div>
  </div>

  <!-- ── END SCREEN ────────────────────────── -->
  <div id="endScreen" class="screen" style="display:none">
    <div class="panel" style="max-width:380px;text-align:center">
      <h1 id="endTitle">GAME OVER</h1>
      <div id="endStats" style="margin:14px 0"></div>
      <div class="end-coins" id="endCoins"></div>
      <button class="play-btn" onclick="backToMenu()" style="margin-top:14px">↩ Menu</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
