<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RaffzSpace</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Segoe UI',Arial,sans-serif;}
body{margin:0;overflow:hidden;color:#fff;background:#020617;touch-action:none;}

/* ═══ CANVAS ═══════════════════════════════════ */
canvas{width:100vw;height:100vh;display:none;}

/* ═══ SCREENS ══════════════════════════════════ */
.screen{
  position:fixed;inset:0;z-index:10;
  display:flex;align-items:center;justify-content:center;padding:16px;
  background:
    radial-gradient(ellipse at 15% 10%,rgba(59,130,246,.32),transparent 38%),
    radial-gradient(ellipse at 85% 80%,rgba(168,85,247,.25),transparent 38%),
    radial-gradient(ellipse at 50% 50%,rgba(6,182,212,.08),transparent 60%),
    linear-gradient(160deg,#020617,#0c1426 55%,#020617);
}
.panel{
  width:min(700px,100%);max-height:93vh;overflow-y:auto;
  padding:20px;border-radius:26px;
  border:1px solid rgba(255,255,255,.11);
  background:rgba(10,18,38,.8);
  backdrop-filter:blur(20px);
  box-shadow:0 28px 70px rgba(0,0,0,.55);
}
.panel::-webkit-scrollbar{width:3px;}
.panel::-webkit-scrollbar-thumb{background:rgba(100,150,255,.3);border-radius:2px;}

/* ═══ MENU HEADER ════════════════════════════════ */
.menu-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.back-btn{
  width:38px;height:38px;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);border-radius:12px;
  color:#94a3b8;font-size:18px;cursor:pointer;display:grid;place-items:center;
  transition:.15s;flex-shrink:0;
}
.back-btn:active{background:rgba(255,255,255,.14);}
h1{
  margin:0;text-align:center;flex:1;
  font-size:clamp(26px,7vw,38px);letter-spacing:2px;font-weight:900;
  background:linear-gradient(90deg,#67e8f9 0%,#a78bfa 45%,#f97316 100%);
  -webkit-background-clip:text;color:transparent;
  text-shadow:none;
  animation:titleGlow 3s ease-in-out infinite;
}
@keyframes titleGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.2)}}
.sub{text-align:center;color:#64748b;margin-bottom:18px;font-size:13px;line-height:1.5;}

/* ═══ COIN BOX ═══════════════════════════════════ */
.coin-box{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px;}
.coin{
  padding:8px 20px;border-radius:999px;
  background:rgba(250,204,21,.1);border:1px solid rgba(250,204,21,.3);
  color:#fde68a;font-weight:700;font-size:16px;
  box-shadow:0 0 20px rgba(250,204,21,.1);
}

/* ═══ SECTION LABELS ═════════════════════════════ */
.sec{
  margin:18px 0 10px;font-size:11px;font-weight:700;letter-spacing:.2em;
  color:rgba(255,255,255,.25);text-transform:uppercase;
  display:flex;align-items:center;gap:8px;
}
.sec::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.07);}

/* ═══ SHIP CARDS ═════════════════════════════════ */
.ships{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.ship-card{
  position:relative;min-height:120px;padding:12px 10px 46px;
  border-radius:18px;border:1.5px solid rgba(255,255,255,.1);
  background:rgba(20,30,55,.7);color:#fff;cursor:pointer;
  overflow:hidden;transition:.2s;
}
.ship-card:active{transform:scale(.97);}
.ship-card.active{
  border-color:var(--c1,#67e8f9);
  box-shadow:0 0 22px rgba(103,232,249,.2),inset 0 0 20px rgba(103,232,249,.06);
  background:rgba(20,35,65,.85);
}
.ship-card h3{margin:0 0 4px;font-size:14px;}
.ship-card p{margin:0;font-size:10px;color:#94a3b8;line-height:1.4;}
.mini-ship{
  position:absolute;right:8px;bottom:4px;
  width:56px;height:56px;
  filter:drop-shadow(0 0 10px rgba(103,232,249,.35));
}
.ship-badge{
  position:absolute;bottom:6px;left:10px;
  font-size:9px;color:rgba(255,255,255,.4);letter-spacing:.05em;
}

/* ═══ UPGRADE GRID ═══════════════════════════════ */
.upgrades{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.upg-btn{
  text-align:left;padding:12px 14px;font-size:13px;
  border-radius:16px;border:1px solid rgba(255,255,255,.1);
  background:rgba(20,30,55,.7);color:#fff;cursor:pointer;
  transition:.18s;
}
.upg-btn:hover{background:rgba(30,45,75,.85);border-color:rgba(255,255,255,.2);}
.upg-btn:active{transform:scale(.97);}
.upg-sub{display:block;margin-top:5px;font-size:11px;font-weight:400;color:#64748b;}
.upg-bar{
  display:flex;gap:3px;margin-top:7px;
}
.upg-pip{width:14px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);}
.upg-pip.filled{background:var(--acc,#67e8f9);}

/* ═══ PLAY BUTTON ════════════════════════════════ */
.play-btn{
  width:100%;margin-top:18px;padding:16px;font-size:18px;font-weight:800;
  border-radius:20px;border:none;color:#fff;cursor:pointer;letter-spacing:.08em;
  background:linear-gradient(135deg,#0891b2,#2563eb,#7c3aed);
  box-shadow:0 0 30px rgba(59,130,246,.3);
  transition:.2s;
}
.play-btn:active{transform:scale(.98);filter:brightness(.9);}
.hint{color:#334155;font-size:11px;text-align:center;margin-top:10px;line-height:1.5;}

/* ═══ HUD ════════════════════════════════════════ */
#hud{
  position:fixed;left:0;right:0;top:0;z-index:5;
  display:none;align-items:center;gap:8px;
  padding:6px 10px;
  background:rgba(2,6,23,.88);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
  height:50px;
}
.hud-btn{
  width:36px;height:36px;padding:0;border-radius:11px;flex-shrink:0;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  color:#94a3b8;font-size:17px;cursor:pointer;display:grid;place-items:center;
  pointer-events:auto;
}
.hud-btn:active{background:rgba(255,255,255,.14);}
.hp-wrap{
  flex:1;display:flex;align-items:center;gap:6px;max-width:200px;
}
.hp-lbl{font-size:10px;color:#475569;width:18px;letter-spacing:.05em;}
.hp-track{
  flex:1;height:7px;background:rgba(255,255,255,.08);
  border-radius:4px;overflow:hidden;
}
.hp-fill{height:100%;border-radius:4px;transition:width .1s,background .3s;}
.hp-num{font-size:10px;color:#94a3b8;white-space:nowrap;min-width:52px;}
.hud-mid{
  flex:2;text-align:center;font-size:11px;
  color:#cbd5e1;letter-spacing:.03em;white-space:nowrap;overflow:hidden;
}

/* ═══ BOSS BAR ═══════════════════════════════════ */
#bossBar{
  position:fixed;left:10px;right:10px;top:54px;z-index:5;
  display:none;padding:5px 12px 7px;
  background:rgba(2,6,23,.9);backdrop-filter:blur(10px);
  border-radius:12px;border:1px solid rgba(239,68,68,.3);
}
.boss-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.boss-lbl{font-size:10px;font-weight:700;color:#ef4444;letter-spacing:.15em;}
.boss-hp-num{font-size:10px;color:#94a3b8;}
.boss-track{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
.boss-fill{
  height:100%;background:linear-gradient(90deg,#ef4444,#b91c1c);
  border-radius:3px;box-shadow:0 0 6px #ef4444;transition:width .12s;
}

/* ═══ END SCREEN ═════════════════════════════════ */
#endScreen{display:none;z-index:20;background:rgba(2,6,23,.88);backdrop-filter:blur(12px);}
#endScreen .panel{text-align:center;max-width:400px;}
.stat-row{
  display:flex;justify-content:space-between;
  padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);
  font-size:13px;
}
.stat-row:last-child{border-bottom:none;}
.stat-val{font-weight:700;color:#e2e8f0;}
.end-coins{
  margin:14px 0;padding:10px 20px;border-radius:14px;
  background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.2);
  color:#fde68a;font-size:15px;font-weight:700;
}

/* ═══ RESPONSIVE ══════════════════════════════════ */
@media(max-width:480px){
  .ships{grid-template-columns:1fr;}
  .upgrades{grid-template-columns:1fr;}
  .ship-card{min-height:100px;}
  h1{font-size:26px;}
}
</style>
</head>
<body>

<!-- ═══ MENU ══════════════════════════════════════════ -->
<div id="menu" class="screen">
  <div class="panel">

    <div class="menu-top">
      <button class="back-btn" onclick="goBack()">←</button>
      <h1>RAFFZSPACE</h1>
      <div style="width:38px;"></div>
    </div>

    <div class="sub">Pilih pesawat · Upgrade · Hadapi boss · Raih skor tertinggi</div>

    <div class="coin-box">
      <div class="coin">🪙 <span id="coinText">0</span> Coin</div>
    </div>

    <div class="sec">Pilih Pesawat</div>
    <div class="ships" id="shipList"></div>

    <div class="sec">Upgrade</div>
    <div class="upgrades">
      <button class="upg-btn" onclick="buyUpgrade('damage')">
        ⚡ Damage
        <span class="upg-sub" id="damageText"></span>
        <div class="upg-bar" id="damagePips" style="--acc:#67e8f9"></div>
      </button>
      <button class="upg-btn" onclick="buyUpgrade('fire')">
        🔥 Fire Rate
        <span class="upg-sub" id="fireText"></span>
        <div class="upg-bar" id="firePips" style="--acc:#fb923c"></div>
      </button>
      <button class="upg-btn" onclick="buyUpgrade('hp')">
        🛡️ Max HP
        <span class="upg-sub" id="hpTextMenu"></span>
        <div class="upg-bar" id="hpPips" style="--acc:#22c55e"></div>
      </button>
      <button class="upg-btn" onclick="buyUpgrade('coin')">
        💰 Coin Bonus
        <span class="upg-sub" id="coinBonusText"></span>
        <div class="upg-bar" id="coinPips" style="--acc:#facc15"></div>
      </button>
    </div>

    <button class="play-btn" onclick="startGame()">▶ MULAI MISI</button>
    <div class="hint">Sentuh/seret layar untuk gerakkan pesawat · ESC untuk pause</div>
  </div>
</div>

<!-- ═══ CANVAS ══════════════════════════════════════ -->
<canvas id="game"></canvas>

<!-- ═══ HUD ═════════════════════════════════════════ -->
<div id="hud">
  <button class="hud-btn" onclick="goBack()">←</button>
  <div class="hp-wrap">
    <div class="hp-lbl">HP</div>
    <div class="hp-track"><div class="hp-fill" id="hpFill"></div></div>
    <div class="hp-num" id="hudHp">—</div>
  </div>
  <div class="hud-mid" id="hudScore">—</div>
  <button class="hud-btn" onclick="togglePause()" id="pauseBtn">⏸</button>
</div>

<!-- ═══ BOSS BAR ════════════════════════════════════ -->
<div id="bossBar">
  <div class="boss-top">
    <div class="boss-lbl">⚠ BOSS</div>
    <div class="boss-hp-num" id="bossHpNum"></div>
  </div>
  <div class="boss-track"><div class="boss-fill" id="bossFill"></div></div>
</div>

<!-- ═══ END SCREEN ═══════════════════════════════════ -->
<div id="endScreen" class="screen">
  <div class="panel">
    <h1 id="endTitle">GAME OVER</h1>
    <div id="endStats" style="margin:14px 0;"></div>
    <div class="end-coins" id="endCoins"></div>
    <button class="play-btn" onclick="backToMenu()" style="margin-top:12px;">↩ Kembali ke Menu</button>
  </div>
</div>

<script>
'use strict';
/* ══════════════════════════════════════════════════
   RAFFZSPACE — RaffzGames Edition
   SFX · Screen shake · Damage floats · Combo · Hub
══════════════════════════════════════════════════ */

// ── Canvas ───────────────────────────────────────
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
let W = innerWidth, H = innerHeight;
let DPR = Math.min(devicePixelRatio||1,2);

function resizeCanvas(){
  W=innerWidth; H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);
  canvas.width=W*DPR; canvas.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resizeCanvas();
addEventListener('resize',resizeCanvas);

// ════════════════════════════════════════════════
//  SOUND EFFECTS
// ════════════════════════════════════════════════
const SFX=(()=>{
  let _ac;
  function ac(){
    if(!_ac) _ac=new(window.AudioContext||window.webkitAudioContext)();
    if(_ac.state==='suspended') _ac.resume();
    return _ac;
  }
  function tone(f,type,vol,dur,delay=0){
    try{
      const c=ac(),t=c.currentTime;
      const o=c.createOscillator(),g=c.createGain();
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(vol,t+delay);
      g.gain.exponentialRampToValueAtTime(0.001,t+delay+dur);
      o.connect(g); g.connect(c.destination);
      o.start(t+delay); o.stop(t+delay+dur+0.05);
    }catch(e){}
  }
  function noise(vol,dur,freq=200){
    try{
      const c=ac(),t=c.currentTime;
      const len=Math.ceil(c.sampleRate*dur);
      const buf=c.createBuffer(1,len,c.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      const s=c.createBufferSource(),f2=c.createBiquadFilter(),g=c.createGain();
      s.buffer=buf; f2.type='bandpass'; f2.frequency.value=freq;
      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      s.connect(f2); f2.connect(g); g.connect(c.destination);
      s.start(); s.stop(t+dur+0.05);
    }catch(e){}
  }
  return{
    // Shoot — different per ship
    shoot(ship){
      if(ship==='nova')        tone(1400,'square',0.05,0.03);
      else if(ship==='titan')  tone(400,'sawtooth',0.07,0.07);
      else                     tone(900,'square',0.055,0.04);
    },
    // Enemy bullet
    enemyShoot(){ tone(260,'square',0.04,0.06); },
    // Bullet hits enemy
    hit(){ noise(0.08,0.06,600); },
    // Player gets hit
    playerHit(){
      tone(200,'sawtooth',0.22,0.1);
      tone(140,'sawtooth',0.16,0.1,0.07);
    },
    // Small explosion
    explodeSmall(){ noise(0.14,0.18,280); tone(110,'sawtooth',0.1,0.15); },
    // Big explosion
    explodeBig(){
      noise(0.35,0.5,160);
      tone(80,'sawtooth',0.28,0.4);
      tone(55,'sawtooth',0.2,0.35,0.1);
    },
    // Boss spawns
    bossSpawn(){
      noise(0.2,0.5,80);
      [80,100,80].forEach((f,i)=>tone(f,'sawtooth',0.22,0.3,i*0.15));
      tone(440,'square',0.12,0.2,0.5);
      tone(880,'square',0.1,0.15,0.7);
    },
    // Boss defeated
    bossDefeat(){
      noise(0.45,0.6,180);
      [100,80,60].forEach((f,i)=>tone(f,'sawtooth',0.28,0.4,i*0.15));
      [523,659,784,1047,1319].forEach((f,i)=>tone(f,'sine',0.14,0.2,0.65+i*0.1));
    },
    // Level up
    levelUp(){
      [400,500,620,800].forEach((f,i)=>tone(f,'square',0.1,0.1,i*0.07));
    },
    // Coin collected
    coin(){ tone(1600,'sine',0.07,0.06); },
    // Game over
    gameOver(){
      [400,340,280,220,160].forEach((f,i)=>tone(f,'sawtooth',0.18,0.28,i*0.13));
      noise(0.1,0.6,100);
    },
  };
})();

// ════════════════════════════════════════════════
//  SHIPS DATA
// ════════════════════════════════════════════════
const ships={
  falcon:{
    name:'Falcon',desc:'Seimbang, cocok untuk semua level.',
    color1:'#67e8f9',color2:'#2563eb',
    hp:110,speed:6.2,damage:2,fireDelay:230,
  },
  nova:{
    name:'Nova',desc:'Cepat, tembak rapat, HP lebih kecil.',
    color1:'#c084fc',color2:'#7c3aed',
    hp:90,speed:7.4,damage:1.8,fireDelay:180,
  },
  titan:{
    name:'Titan',desc:'Lambat, HP besar, damage sakit.',
    color1:'#fb923c',color2:'#dc2626',
    hp:155,speed:4.7,damage:3,fireDelay:265,
  }
};

// ════════════════════════════════════════════════
//  SAVE / MENU
// ════════════════════════════════════════════════
let save=JSON.parse(localStorage.getItem('raffzSpaceSave'))||{
  coins:160,ship:'falcon',
  upgrades:{damage:1,fire:1,hp:1,coin:1}
};
const MAX_UPGRADE=8;

function saveData(){localStorage.setItem('raffzSpaceSave',JSON.stringify(save));updateMenu();}

function upgradeCost(t){return {damage:75,fire:85,hp:70,coin:100}[t]+save.upgrades[t]*45;}

function buyUpgrade(t){
  if(save.upgrades[t]>=MAX_UPGRADE){alert('Upgrade sudah MAX!');return;}
  const cost=upgradeCost(t);
  if(save.coins<cost){alert('Coin belum cukup!');return;}
  save.coins-=cost;save.upgrades[t]++;saveData();
}

function makePips(id,lvl,max,acc){
  const el=document.getElementById(id);
  if(!el) return;
  el.innerHTML='';el.style.setProperty('--acc',acc);
  for(let i=0;i<max;i++){
    const pip=document.createElement('div');
    pip.className='upg-pip'+(i<lvl?' filled':'');
    el.appendChild(pip);
  }
}

function updateMenu(){
  document.getElementById('coinText').textContent=save.coins;
  const u=save.upgrades;
  const AT=[
    ['damage','damageText','damagePips','#67e8f9'],
    ['fire','fireText','firePips','#fb923c'],
    ['hp','hpTextMenu','hpPips','#22c55e'],
    ['coin','coinBonusText','coinPips','#facc15'],
  ];
  AT.forEach(([type,tid,pid,acc])=>{
    const lv=u[type], cost=upgradeCost(type);
    const maxed=lv>=MAX_UPGRADE;
    document.getElementById(tid).textContent=
      maxed?'MAX':(`Lv ${lv}  •  ${cost} coin`);
    makePips(pid,lv,MAX_UPGRADE,acc);
  });

  const shipList=document.getElementById('shipList');
  shipList.innerHTML='';
  Object.keys(ships).forEach(id=>{
    const s=ships[id];
    const card=document.createElement('button');
    card.className='ship-card'+(save.ship===id?' active':'');
    card.style.setProperty('--c1',s.color1);
    card.onclick=()=>{save.ship=id;saveData();};
    card.innerHTML=`
      <h3 style="color:${s.color1}">${s.name}</h3>
      <p>${s.desc}</p>
      <svg class="mini-ship" viewBox="0 0 80 80">
        <defs>
          <linearGradient id="gm${id}" x1="0" x2="1">
            <stop offset="0%" stop-color="${s.color1}"/>
            <stop offset="100%" stop-color="${s.color2}"/>
          </linearGradient>
        </defs>
        <path d="M40 5 L55 55 L40 46 L25 55 Z" fill="url(#gm${id})"/>
        <path d="M20 40 L6 62 L30 55 Z" fill="${s.color2}" opacity=".9"/>
        <path d="M60 40 L74 62 L50 55 Z" fill="${s.color2}" opacity=".9"/>
        <ellipse cx="40" cy="30" rx="8" ry="13" fill="#e0f2fe"/>
        <circle cx="40" cy="65" r="5" fill="#facc15"/>
      </svg>
      <div class="ship-badge">HP ${s.hp} · SPD ${s.speed}</div>
    `;
    shipList.appendChild(card);
  });
}
updateMenu();

// ════════════════════════════════════════════════
//  GAME STATE
// ════════════════════════════════════════════════
let player,bullets=[],enemies=[],enemyBullets=[],particles=[],
    stars=[],nebulae=[],boss=null,rings=[],floats=[],announce=null;
let keys={},playing=false,paused=false;
let score=0,level=1,runCoins=0,lastShot=0,enemySpawn=0;
let targetX=null,targetY=null,loopStarted=false;
let shakeAmt=0;
let combo=0,comboTimer=0;
let killCount=0;

function addShake(a){shakeAmt=Math.max(shakeAmt,a);}

function showAnnounce(text,color='#fff',size=1){
  announce={text,color,size,life:110,max:110};
}

// ════════════════════════════════════════════════
//  BACKGROUND
// ════════════════════════════════════════════════
function createStars(){
  stars=[];
  // Layer 1: slow dim stars
  for(let i=0;i<80;i++) stars.push({x:Math.random()*W,y:Math.random()*H,z:.4+Math.random()*.5,a:.3+Math.random()*.5,layer:0});
  // Layer 2: medium stars
  for(let i=0;i<50;i++) stars.push({x:Math.random()*W,y:Math.random()*H,z:1+Math.random()*.8,a:.5+Math.random()*.5,layer:1});
  // Layer 3: fast bright streaks
  for(let i=0;i<18;i++) stars.push({x:Math.random()*W,y:Math.random()*H,z:2.2+Math.random(),a:.7+Math.random()*.3,layer:2});

  nebulae=[];
  const nc=['rgba(59,130,246,.07)','rgba(168,85,247,.06)','rgba(6,182,212,.05)','rgba(236,72,153,.04)'];
  for(let i=0;i<5;i++) nebulae.push({
    x:Math.random()*W,y:Math.random()*H,
    rx:180+Math.random()*250,ry:100+Math.random()*160,
    c:nc[i%nc.length],vy:.12+Math.random()*.1,
  });
}

function drawBackground(){
  // Nebulae
  nebulae.forEach(n=>{
    n.y+=n.vy;
    if(n.y>H+n.ry){n.y=-n.ry;n.x=Math.random()*W;}
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.rx);
    g.addColorStop(0,n.c); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.fillRect(n.x-n.rx,n.y-n.ry,n.rx*2,n.ry*2);
  });
  // Stars
  ctx.save();
  stars.forEach(s=>{
    s.y+=s.z*1.3;
    if(s.y>H){s.y=-5;s.x=Math.random()*W;}
    ctx.globalAlpha=s.a;
    ctx.fillStyle='#e0f2fe';
    const w=s.layer===2?s.z*.6:s.z*.8;
    const h=s.layer===2?s.z*3:s.z*1.5;
    ctx.fillRect(s.x,s.y,w,h);
  });
  ctx.globalAlpha=1;
  ctx.restore();
  // Faint grid lines
  ctx.save();
  ctx.globalAlpha=.07;
  ctx.strokeStyle='#38bdf8';ctx.lineWidth=1;
  for(let y=H%55;y<H;y+=55){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
  ctx.restore();
}

// ════════════════════════════════════════════════
//  EXPLOSIONS / FX
// ════════════════════════════════════════════════
function createExplosion(x,y,color,count=18,big=false){
  for(let i=0;i<count;i++){
    particles.push({
      x,y,
      vx:(Math.random()-.5)*(big?9:6),
      vy:(Math.random()-.5)*(big?9:6),
      life:Math.random()*25+20,max:50,
      r:Math.random()*(big?6:4)+2,
      color,
    });
  }
  // Shockwave ring
  rings.push({x,y,r:0,maxR:big?180:80,color,life:1.0,speed:big?10:6});
  if(big){
    rings.push({x,y,r:0,maxR:120,color:'#fff',life:.6,speed:7});
  }
}

function addFloat(x,y,text,color='#fff'){
  floats.push({x,y:y-10,text,color,life:65,max:65,vy:-.85});
}

function startGame(){
  const base=ships[save.ship];
  player={
    x:W/2,y:H-100,r:28,
    hp:base.hp+save.upgrades.hp*24,
    maxHp:base.hp+save.upgrades.hp*24,
    speed:base.speed,
    damage:base.damage+save.upgrades.damage*.75,
    fireDelay:Math.max(85,base.fireDelay-save.upgrades.fire*17),
    ship:save.ship,inv:0,
  };
  bullets=[];enemies=[];enemyBullets=[];particles=[];rings=[];floats=[];
  boss=null;announce=null;
  score=0;level=1;runCoins=0;enemySpawn=0;lastShot=0;combo=0;comboTimer=0;killCount=0;
  targetX=player.x;targetY=player.y;shakeAmt=0;

}

function gameOver(){

  SFX.gameOver();

      <div class="stat-row"><span>Skor</span><span class="stat-val">${score}</span></div>
      <div class="stat-row"><span>Level Tercapai</span><span class="stat-val">${level}</span></div>

let maxCombo=0;
function addCoins(a){runCoins+=Math.ceil(a*(1+save.upgrades.coin*.12));}

function hitPlayer(dmg){
  if(player.inv>0) return;
  player.hp-=dmg;player.inv=40;
  SFX.playerHit();addShake(14);
  createExplosion(player.x,player.y,'#60a5fa',10);
  if(player.hp<=0){player.hp=0;gameOver();}
}

//  SHOOTING
// ════════════════════════════════════════════════
function shoot(){
  const now=performance.now();
  if(now-lastShot<player.fireDelay) return;
  const spread=save.ship==='nova'?13:save.ship==='titan'?18:0;
  const c1=ships[player.ship].color1;

  bullets.push({x:player.x,y:player.y-38,vx:0,vy:-10.5,r:5,damage:player.damage,color:c1});
  if(save.ship!=='falcon'){
    bullets.push({x:player.x-spread,y:player.y-20,vx:-.4,vy:-9.8,r:4,damage:player.damage*.7,color:c1});
    bullets.push({x:player.x+spread,y:player.y-20,vx:.4,vy:-9.8,r:4,damage:player.damage*.7,color:c1});
  }
  SFX.shoot(save.ship);
  lastShot=now;
}

// ════════════════════════════════════════════════
function spawnEnemy(){
  let type='scout';
  const ch=Math.random();
  if(level>=3&&ch>.72) type='orb';
  if(level>=5&&ch>.84) type='heavy';
  if(level>=7&&ch>.91) type='blade';
  const data={
    scout:{hp:4+level,r:20,speed:2.2+level*.12,coin:5},
    orb:  {hp:8+level*1.4,r:24,speed:1.8+level*.1,coin:9},
    heavy:{hp:15+level*2,r:32,speed:1.2+level*.08,coin:15},
    blade:{hp:10+level*1.7,r:27,speed:2.8+level*.13,coin:13},
  }[type];
  enemies.push({
    type,x:Math.random()*(W-80)+40,y:-60,
    r:data.r,hp:data.hp,maxHp:data.hp,
    speed:data.speed,coin:data.coin,
    rot:Math.random()*10,shootTimer:Math.random()*120,
    hitFlash:0,
  });
}

function spawnBoss(){
  boss={
    x:W/2,y:105,
    w:Math.min(240,W-40),h:90,
    hp:160+level*55,maxHp:160+level*55,
    dir:1,shootTimer:0,phase:0,
  };
  SFX.bossSpawn();
  addShake(20);
  showAnnounce('⚠ BOSS MUNCUL ⚠','#ef4444',1.4);
  createExplosion(W/2,100,'#ef4444',40,true);
  document.getElementById('bossBar').style.display='block';
}

function dist(a,b){const dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy);}

// ════════════════════════════════════════════════
//  UPDATE
// ════════════════════════════════════════════════
function update(){
  if(!playing||paused) return;
  if(player.inv>0) player.inv--;

  // Combo timeout
  if(comboTimer>0){comboTimer--;if(comboTimer<=0)combo=0;}

  // Movement
  if(keys.ArrowLeft||keys.a) player.x-=player.speed;
  if(keys.ArrowRight||keys.d) player.x+=player.speed;
  if(keys.ArrowUp||keys.w) player.y-=player.speed;
  if(keys.ArrowDown||keys.s) player.y+=player.speed;
  if(targetX!==null&&targetY!==null){
    player.x+=(targetX-player.x)*.14;
    player.y+=(targetY-player.y)*.14;
  }
  player.x=Math.max(34,Math.min(W-34,player.x));
  player.y=Math.max(58,Math.min(H-42,player.y));

  shoot();

  // Engine trail
  if(Math.random()<.7){
    const s=ships[player.ship];
    particles.push({
      x:player.x+(Math.random()-.5)*14,y:player.y+36,
      vx:(Math.random()-.5)*.8,vy:1.5+Math.random()*1.5,
      life:14+Math.random()*10,max:24,
      r:1.5+Math.random()*2,color:s.color1,trail:true,
    });
  }

  // Enemy spawn
  enemySpawn++;
  const spawnLimit=Math.max(20,62-level*3);
  if(enemySpawn>spawnLimit&&!boss){spawnEnemy();enemySpawn=0;}

  // Level up
  if(score>level*190){
    level++;
    SFX.levelUp();
    showAnnounce(`LEVEL ${level}`,'#67e8f9');
    if(level%4===0&&!boss) spawnBoss();
  }

  // Bullets
  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;});
  enemyBullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;});

  // Enemies
  enemies.forEach(e=>{
    e.y+=e.speed;
    e.rot+=e.type==='blade'?.12:.025;
    if(e.hitFlash>0) e.hitFlash--;
    e.shootTimer++;
    if(e.shootTimer>120-level*4&&Math.random()<.04){
      enemyBullets.push({
        x:e.x,y:e.y+e.r,
        vx:(player.x-e.x)*.006,vy:4+level*.05,
        r:5,damage:e.type==='heavy'?18:10,
      });
      SFX.enemyShoot();
      e.shootTimer=0;
    }
    if(dist(e,player)<e.r+player.r*.72){e.hp=0;hitPlayer(e.type==='heavy'?30:18);}
    if(e.y>H+80){e.hp=0;hitPlayer(10);}
  });

  // Bullet vs enemy / boss
  bullets.forEach(b=>{
    enemies.forEach(e=>{
      if(dist(b,e)<b.r+e.r){
        e.hp-=b.damage; e.hitFlash=8;
        b.y=-999;
        SFX.hit();
        createExplosion(b.x,b.y,b.color,4);
        addFloat(e.x,e.y,`-${Math.ceil(b.damage)}`,b.color);
      }
    });
    if(boss){
      const hb=b.x>boss.x-boss.w/2&&b.x<boss.x+boss.w/2&&
               b.y>boss.y-boss.h/2&&b.y<boss.y+boss.h/2;
      if(hb){
        boss.hp-=b.damage;b.y=-999;
        SFX.hit();
        createExplosion(b.x,b.y,'#f87171',4);
        addFloat(boss.x+(Math.random()-.5)*60,boss.y,`-${Math.ceil(b.damage)}`,'#fca5a5');
      }
    }
  });

  // Enemy bullet vs player
  enemyBullets.forEach(b=>{
    if(dist(b,player)<b.r+player.r*.65){b.y=H+999;hitPlayer(b.damage);}
  });

  // Kill enemies
  enemies=enemies.filter(e=>{
    if(e.hp<=0){
      const pts=e.type==='heavy'?35:e.type==='orb'?25:e.type==='blade'?28:15;
      score+=pts;
      combo++; if(combo>maxCombo) maxCombo=combo;
      comboTimer=90;killCount++;
      addCoins(e.coin);
      SFX.explodeSmall();
      const col=e.type==='orb'?'#22d3ee':e.type==='blade'?'#a855f7':'#ef4444';
      createExplosion(e.x,e.y,col,18);
      if(combo>=3) addFloat(e.x,e.y-28,`${combo}x COMBO!`,'#facc15');
      SFX.coin();
      return false;
    }
    return true;
  });

  // Boss update
  if(boss){
    boss.x+=boss.dir*(1.6+level*.04);
    if(boss.x<boss.w/2+10||boss.x>W-boss.w/2-10) boss.dir*=-1;
    boss.shootTimer++;
    if(boss.shootTimer>42){
      for(let i=-2;i<=2;i++){
        enemyBullets.push({
          x:boss.x+i*26,y:boss.y+50,
          vx:i*.55,vy:4.2+level*.06,r:6,damage:14,
        });
      }
      SFX.enemyShoot();
      boss.shootTimer=0;
    }
    if(boss.hp<=0){
      score+=400;addCoins(120);killCount+=10;
      SFX.bossDefeat();addShake(22);
      createExplosion(boss.x,boss.y,'#ef4444',60,true);
      showAnnounce('BOSS DEFEATED!','#facc15',1.3);
      boss=null;
      document.getElementById('bossBar').style.display='none';
    }
    // Update boss bar
    if(boss){
      const pct=Math.max(0,boss.hp/boss.maxHp);
      document.getElementById('bossFill').style.width=`${pct*100}%`;
      document.getElementById('bossHpNum').textContent=
        `${Math.ceil(boss.hp)} / ${boss.maxHp}`;
    }
  }

  // Particles
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.life--;});
  particles=particles.filter(p=>p.life>0);
  bullets=bullets.filter(b=>b.y>-80&&b.y<H+80);
  enemyBullets=enemyBullets.filter(b=>b.y<H+80);
  rings=rings.filter(r=>r.life>0);
  floats=floats.filter(f=>f.life>0);
}

// ════════════════════════════════════════════════
//  DRAW HELPERS
// ════════════════════════════════════════════════
function poly(pts){
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();ctx.fill();
}
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}

// ════════════════════════════════════════════════
//  DRAW PLAYER
// ════════════════════════════════════════════════
function drawPlayer(){
  const s=ships[player.ship];
  const blink=player.inv>0&&Math.floor(player.inv/4)%2===0;
  if(blink) return;
  ctx.save();ctx.translate(player.x,player.y);
  // Engine glow
  const eg=ctx.createRadialGradient(0,34,2,0,34,28);
  eg.addColorStop(0,'#fef3c7');eg.addColorStop(.35,s.color1);eg.addColorStop(1,'transparent');
  ctx.fillStyle=eg;ctx.beginPath();ctx.ellipse(0,36,20,30,0,0,Math.PI*2);ctx.fill();
  // Ship body
  if(player.ship==='falcon') drawFalcon(s);
  if(player.ship==='nova')   drawNova(s);
  if(player.ship==='titan')  drawTitan(s);
  ctx.restore();
}

function drawFalcon(s){
  const g=ctx.createLinearGradient(0,-40,0,40);
  g.addColorStop(0,'#e0f2fe');g.addColorStop(.35,s.color1);g.addColorStop(1,s.color2);
  ctx.shadowColor=s.color1;ctx.shadowBlur=20;
  ctx.fillStyle='rgba(37,99,235,.9)';
  poly([[-12,-2],[-45,28],[-18,20],[-8,36]]);
  poly([[12,-2],[45,28],[18,20],[8,36]]);
  ctx.fillStyle=g;
  poly([[0,-46],[17,20],[0,38],[-17,20]]);
  ctx.fillStyle='rgba(15,23,42,.8)';
  poly([[0,-28],[8,5],[0,16],[-8,5]]);
  ctx.fillStyle='#cffafe';ctx.beginPath();ctx.ellipse(0,-10,7,14,0,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#facc15';ctx.fillRect(-11,34,7,10);ctx.fillRect(4,34,7,10);
}
function drawNova(s){
  const g=ctx.createLinearGradient(0,-44,0,42);
  g.addColorStop(0,'#f5d0fe');g.addColorStop(.4,s.color1);g.addColorStop(1,s.color2);
  ctx.shadowColor=s.color1;ctx.shadowBlur=22;
  ctx.fillStyle='rgba(88,28,135,.88)';
  poly([[-9,-8],[-54,6],[-34,24],[-15,18]]);
  poly([[9,-8],[54,6],[34,24],[15,18]]);
  ctx.fillStyle='rgba(192,132,252,.7)';
  poly([[-18,14],[-38,42],[-10,31]]);
  poly([[18,14],[38,42],[10,31]]);
  ctx.fillStyle=g;
  poly([[0,-48],[16,-5],[12,30],[0,43],[-12,30],[-16,-5]]);
  ctx.fillStyle='#e9d5ff';ctx.beginPath();ctx.ellipse(0,-18,8,16,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fef08a';ctx.beginPath();
  ctx.arc(-11,36,5,0,Math.PI*2);ctx.arc(11,36,5,0,Math.PI*2);ctx.fill();
}
function drawTitan(s){
  const g=ctx.createLinearGradient(0,-42,0,46);
  g.addColorStop(0,'#fed7aa');g.addColorStop(.38,s.color1);g.addColorStop(1,s.color2);
  ctx.shadowColor=s.color1;ctx.shadowBlur=20;
  ctx.fillStyle='rgba(127,29,29,.95)';
  poly([[-18,-8],[-58,22],[-34,39],[-13,24]]);
  poly([[18,-8],[58,22],[34,39],[13,24]]);
  ctx.fillStyle=g;rr(-20,-31,40,66,15);
  ctx.fillStyle='#7f1d1d';poly([[0,-50],[17,-25],[-17,-25]]);
  ctx.fillStyle='#ffedd5';rr(-8,-18,16,24,8);
  ctx.fillStyle='#fde047';rr(-16,32,9,14,4);rr(7,32,9,14,4);
}

// ════════════════════════════════════════════════
//  DRAW ENEMIES
// ════════════════════════════════════════════════
function drawEnemy(e){
  ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rot);
  const hp=Math.max(0,e.hp/e.maxHp);

  if(e.hitFlash>0){ctx.globalAlpha=.35+.65*(e.hitFlash/8);}

  if(e.type==='scout'){
    ctx.shadowColor='#ef4444';ctx.shadowBlur=14;
    ctx.fillStyle=e.hitFlash>0?'#fff':'#991b1b';
    poly([[0,-24],[24,20],[0,10],[-24,20]]);
    ctx.fillStyle='#fca5a5';poly([[0,-12],[10,12],[0,6],[-10,12]]);
    ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();
  }
  if(e.type==='orb'){
    ctx.shadowColor='#22d3ee';ctx.shadowBlur=18;
    const g=ctx.createRadialGradient(-6,-6,2,0,0,e.r);
    g.addColorStop(0,e.hitFlash>0?'#fff':'#cffafe');
    g.addColorStop(.45,'#0891b2');g.addColorStop(1,'#164e63');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#67e8f9';ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(0,0,e.r+7,9,Math.PI/5,0,Math.PI*2);ctx.stroke();
  }
  if(e.type==='heavy'){
    ctx.shadowColor='#fb923c';ctx.shadowBlur=18;
    ctx.fillStyle=e.hitFlash>0?'#fff':'#7f1d1d';
    rr(-e.r,-e.r*.7,e.r*2,e.r*1.4,13);
    ctx.fillStyle=e.hitFlash>0?'#fcd34d':'#f97316';
    rr(-e.r*.6,-e.r*.45,e.r*1.2,e.r*.9,10);
    ctx.fillStyle='#fed7aa';ctx.fillRect(-8,-e.r*.7,16,e.r*1.4);
  }
  if(e.type==='blade'){
    ctx.shadowColor='#a855f7';ctx.shadowBlur=22;
    ctx.fillStyle=e.hitFlash>0?'#fff':'#581c87';
    poly([[0,-31],[13,-7],[31,0],[13,7],[0,31],[-13,7],[-31,0],[-13,-7]]);
    ctx.fillStyle=e.hitFlash>0?'#fff':'#d8b4fe';
    ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();
  }

  ctx.globalAlpha=1;
  ctx.rotate(-e.rot);
  // HP bar
  ctx.fillStyle='rgba(15,23,42,.7)';ctx.fillRect(-22,e.r+9,44,5);
  const hpcol=hp>.5?'#22c55e':hp>.25?'#eab308':'#ef4444';
  ctx.fillStyle=hpcol;ctx.fillRect(-22,e.r+9,44*hp,5);
  ctx.restore();
}

// ════════════════════════════════════════════════
//  DRAW BOSS
// ════════════════════════════════════════════════
function drawBoss(){
  if(!boss) return;
  ctx.save();ctx.translate(boss.x,boss.y);
  ctx.shadowColor='#ef4444';ctx.shadowBlur=28;
  const g=ctx.createLinearGradient(0,-boss.h/2,0,boss.h/2);
  g.addColorStop(0,'#fecaca');g.addColorStop(.35,'#dc2626');g.addColorStop(1,'#450a0a');
  ctx.fillStyle='#7f1d1d';
  poly([
    [-boss.w/2,-10],[-boss.w/2+40,-boss.h/2],[0,-boss.h/2+18],[boss.w/2-40,-boss.h/2],
    [boss.w/2,-10],[boss.w/2-35,boss.h/2],[0,boss.h/2-18],[-boss.w/2+35,boss.h/2]
  ]);
  ctx.fillStyle=g;rr(-boss.w*.28,-boss.h*.36,boss.w*.56,boss.h*.72,18);
  ctx.fillStyle='#fee2e2';rr(-22,-22,44,30,12);
  // Pulsing cannons
  const pulse=.7+.3*Math.sin(Date.now()*.006);
  ctx.fillStyle=`rgba(250,204,21,${pulse})`;
  ctx.shadowColor='#facc15';ctx.shadowBlur=12;
  ctx.beginPath();
  ctx.arc(-boss.w*.34,10,8,0,Math.PI*2);
  ctx.arc(boss.w*.34,10,8,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// ════════════════════════════════════════════════
//  DRAW BULLETS / PARTICLES / FX
// ════════════════════════════════════════════════
function drawBullets(){
  bullets.forEach(b=>{
    ctx.save();ctx.shadowColor=b.color;ctx.shadowBlur=16;
    const g=ctx.createLinearGradient(b.x,b.y+14,b.x,b.y-22);
    g.addColorStop(0,'transparent');g.addColorStop(.35,b.color);g.addColorStop(1,'#ffffff');
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(b.x-b.r/2,b.y-22,b.r,30,8);ctx.fill();
    ctx.restore();
  });
  enemyBullets.forEach(b=>{
    ctx.save();ctx.shadowColor='#f87171';ctx.shadowBlur=14;
    ctx.fillStyle='#fb7185';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fee2e2';ctx.beginPath();ctx.arc(b.x-1.5,b.y-1.5,b.r*.35,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}

function drawParticles(){
  particles.forEach(p=>{
    if(p.trail){
      // Engine trail — faint
      ctx.save();
      ctx.globalAlpha=Math.max(0,p.life/p.max)*.5;
      ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha=Math.max(0,p.life/p.max);
      ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=10;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  });
}

function drawRings(){
  rings.forEach(r=>{
    r.r+=r.speed; r.life-=.045;
    ctx.save();
    ctx.globalAlpha=Math.max(0,r.life);
    ctx.strokeStyle=r.color;ctx.lineWidth=3;
    ctx.shadowColor=r.color;ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  });
}

function drawFloats(){
  floats.forEach(f=>{
    f.y+=f.vy; f.life--;
    ctx.save();
    ctx.globalAlpha=Math.max(0,f.life/f.max);
    ctx.fillStyle=f.color;
    ctx.shadowColor=f.color;ctx.shadowBlur=6;
    ctx.font=`bold ${12+Math.round((1-f.life/f.max)*3)}px Arial`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(f.text,f.x,f.y);
    ctx.restore();
  });
}

function drawAnnounce(){
  if(!announce) return;
  announce.life--;
  if(announce.life<=0){announce=null;return;}
  const fade=Math.min(1,announce.life/30)*Math.min(1,(announce.life/announce.max)*2.8);
  ctx.save();
  ctx.globalAlpha=fade;
  ctx.fillStyle=announce.color;
  ctx.shadowColor=announce.color;ctx.shadowBlur=30;
  ctx.font=`900 ${Math.round(28*(announce.size||1))}px Arial`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(announce.text,W/2,H/2);
  ctx.restore();
}

// ════════════════════════════════════════════════
//  DRAW HUD
// ════════════════════════════════════════════════
function drawHUD(){
  const hp=player.hp,mhp=player.maxHp,pct=Math.max(0,hp/mhp);
  const fill=document.getElementById('hpFill');
  const col=pct>.5?'linear-gradient(90deg,#22c55e,#86efac)':
             pct>.25?'linear-gradient(90deg,#eab308,#fde047)':
             'linear-gradient(90deg,#ef4444,#fb7185)';
  fill.style.width=`${pct*100}%`;fill.style.background=col;
  document.getElementById('hudHp').textContent=`${Math.max(0,Math.ceil(hp))}/${mhp}`;
  const comboTxt=combo>=3?` · 🔥${combo}x`:'';
  document.getElementById('hudScore').textContent=
    `Score ${score} · Lv ${level} · +${runCoins}🪙${comboTxt}`;
}

// ════════════════════════════════════════════════
//  DRAW (MAIN)
// ════════════════════════════════════════════════
function draw(){
  ctx.clearRect(0,0,W,H);

  // Apply screen shake
  ctx.save();
  if(shakeAmt>.5){
    ctx.translate((Math.random()-.5)*shakeAmt*2,(Math.random()-.5)*shakeAmt*2);
    shakeAmt*=.75;
  } else shakeAmt=0;

  drawBackground();
  drawBullets();
  enemies.forEach(drawEnemy);
  drawBoss();
  drawPlayer();
  drawRings();
  drawParticles();
  drawFloats();
  drawAnnounce();

  if(paused){
    ctx.fillStyle='rgba(2,6,23,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.textAlign='center';
    ctx.font='bold 38px Arial';ctx.fillText('PAUSE',W/2,H/2);
    ctx.font='14px Arial';ctx.fillStyle='#64748b';
    ctx.fillText('Tekan ⏸ atau ESC untuk lanjut',W/2,H/2+34);
  }

  ctx.restore();
  drawHUD();
}

// ════════════════════════════════════════════════
//  GAME LOOP
// ════════════════════════════════════════════════
function gameLoop(){
  requestAnimationFrame(gameLoop);
  if(!playing&&document.getElementById('endScreen').style.display!=='flex') return;
  update();draw();
}

// ════════════════════════════════════════════════
//  INPUT
// ════════════════════════════════════════════════
addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key==='Escape') togglePause();
});
addEventListener('keyup',e=>{keys[e.key]=false;});

function setPointer(e){
  const p=e.touches?e.touches[0]:e;
  targetX=p.clientX;targetY=p.clientY;
}
canvas.addEventListener('touchstart',setPointer,{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();setPointer(e);},{passive:false});
canvas.addEventListener('mousemove',setPointer);
</script>
