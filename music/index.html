<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whoop Music</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<a href="../home.html" class="back-btn" id="backBtn">← Kembali</a>

<div class="top-bar">
  <h1>🎵 Whoop Music</h1>
  <label class="upload-btn">
    + Upload
    <input type="file" id="musicInput" accept="audio/*" multiple hidden>
  </label>
</div>

<div class="playlist-bar">
  <div class="playlist-tabs" id="playlistTabs"></div>
  <button class="pl-new-btn" id="btnNewPlaylist">+ Playlist</button>
</div>

<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="🔍  Cari lagu..." autocomplete="off">
</div>

<div id="musicList" class="music-list"></div>

<!-- MINI PLAYER (3 baris) -->
<div class="mini-player" id="miniPlayer">
  <!-- Row 1: Art + Info + Mode buttons -->
  <div class="player-row1">
    <div class="player-art" id="playerArt">🎵</div>
    <div class="player-info">
      <div class="player-title" id="nowPlaying">Tidak ada musik</div>
      <div class="player-sub"  id="playerPlaylist">—</div>
    </div>
    <div class="player-modes">
      <button class="mode-btn" id="btnShuffle" title="Shuffle" onclick="toggleShuffle()">🔀</button>
      <button class="mode-btn" id="btnRepeat"  title="Repeat"  onclick="toggleRepeat()">🔁</button>
    </div>
  </div>

  <!-- Row 2: Progress bar -->
  <div class="player-row2">
    <span class="time-label"      id="timeNow">0:00</span>
    <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1">
    <span class="time-label right" id="timeTotal">0:00</span>
  </div>

  <!-- Row 3: Prev / Play / Next -->
  <div class="player-row3">
    <div class="player-controls">
      <button onclick="prevMusic()">⏮</button>
      <button id="playPauseBtn" onclick="toggleCurrentMusic()">▶</button>
      <button onclick="nextMusic()">⏭</button>
    </div>
  </div>
</div>

<!-- Modal: Playlist baru -->
<div class="modal-overlay hidden" id="modalPlaylist">
  <div class="modal-box">
    <h3>Nama Playlist</h3>
    <input type="text" id="newPlaylistName" placeholder="Contoh: Favorit" maxlength="30">
    <div class="modal-btns">
      <button class="mbtn mbtn-cancel" onclick="closeModal()">Batal</button>
      <button class="mbtn mbtn-ok"     onclick="createPlaylist()">Buat</button>
    </div>
  </div>
</div>

<!-- Modal: Add to playlist -->
<div class="modal-overlay hidden" id="modalAddPl">
  <div class="modal-box">
    <h3>Tambah ke Playlist</h3>
    <div id="addPlList" class="add-pl-list"></div>
    <div class="modal-btns">
      <button class="mbtn mbtn-cancel" onclick="document.getElementById('modalAddPl').classList.add('hidden')">Tutup</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
