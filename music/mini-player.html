<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mini Player</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:rgba(10,10,20,.97);font-family:'Segoe UI',sans-serif;user-select:none;touch-action:manipulation}

.player{
  display:grid;
  grid-template-rows:1fr auto auto;
  height:100%;
  padding:10px 14px 12px;
  gap:6px;
}

/* Row 1: Art + Info + Modes */
.r1{display:flex;align-items:center;gap:10px}
.art{
  width:42px;height:42px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,#5865f2,#a855f7);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;overflow:hidden;
}
.art img{width:100%;height:100%;object-fit:cover;border-radius:11px}
.info{flex:1;min-width:0}
.title{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:10px;color:#445;margin-top:2px}
.modes{display:flex;gap:5px;flex-shrink:0}
.mbtn{width:28px;height:28px;border:none;border-radius:8px;background:rgba(255,255,255,.07);color:#667;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.mbtn.on{background:rgba(88,101,242,.3);color:#818cf8}

/* Row 2: Progress */
.r2{display:flex;align-items:center;gap:7px}
.t{font-size:10px;color:#334;flex-shrink:0;width:30px;font-variant-numeric:tabular-nums}
.tr{text-align:right}
#prog{flex:1;height:3px;accent-color:#5865f2;cursor:pointer;border-radius:2px}

/* Row 3: Controls */
.r3{display:flex;align-items:center;justify-content:center;gap:8px}
.cbtn{width:38px;height:38px;border:none;border-radius:11px;background:rgba(255,255,255,.07);color:#ccc;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.cbtn:hover{background:rgba(255,255,255,.14)}
#playBtn{width:48px!important;height:48px!important;border-radius:14px!important;background:linear-gradient(135deg,#5865f2,#a855f7)!important;font-size:20px!important;box-shadow:0 4px 20px rgba(88,101,242,.4)}

/* Open full player link */
.open-full{position:absolute;top:8px;right:14px;font-size:9px;color:#223;cursor:pointer;background:none;border:none;font-family:inherit;letter-spacing:.1em;text-transform:uppercase}
.open-full:hover{color:#667}

/* No music state */
.no-music{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:6px;color:#223;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.no-music .icon{font-size:28px;opacity:.4}
</style>
</head>
<body>

<div class="player" id="player">
  <div class="r1">
    <div class="art" id="art">🎵</div>
    <div class="info">
      <div class="title" id="titleEl">Tidak ada musik</div>
      <div class="sub"   id="subEl">Buka Whoop Music untuk upload</div>
    </div>
    <div class="modes">
      <button class="mbtn" id="btnShuffle" onclick="toggleShuffle()" title="Shuffle">🔀</button>
      <button class="mbtn" id="btnRepeat"  onclick="toggleRepeat()"  title="Repeat">🔁</button>
    </div>
  </div>

  <div class="r2">
    <span class="t" id="tNow">0:00</span>
    <input type="range" id="prog" value="0" min="0" max="100" step=".1">
    <span class="t tr" id="tTotal">0:00</span>
  </div>

  <div class="r3">
    <button class="cbtn" onclick="prev()">⏮</button>
    <button class="cbtn" id="playBtn" onclick="togglePlay()">▶</button>
    <button class="cbtn" onclick="next()">⏭</button>
  </div>
</div>

<script>
'use strict';

// ── IndexedDB ──────────────────────────────────────────────────────────────
const DB='WhoopMusicDB', VER=1;
let db=null;

function openDB(){
  return new Promise((res,rej)=>{
    if(db){res(db);return;}
    const r=indexedDB.open(DB,VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      ['songs','playlists','state'].forEach(s=>{
        if(!d.objectStoreNames.contains(s))
          d.createObjectStore(s,{keyPath:'id'||'key'});
      });
    };
    r.onsuccess=e=>{db=e.target.result;res(db);};
    r.onerror=e=>rej(e);
  });
}

function dbGet(store,key){
  return openDB().then(d=>new Promise((res,rej)=>{
    const r=d.transaction(store,'readonly').objectStore(store).get(key);
    r.onsuccess=()=>res(r.result);r.onerror=e=>rej(e);
  }));
}
function dbGetAll(store){
  return openDB().then(d=>new Promise((res,rej)=>{
    const r=d.transaction(store,'readonly').objectStore(store).getAll();
    r.onsuccess=()=>res(r.result);r.onerror=e=>rej(e);
  }));
}
function dbPut(store,val){
  return openDB().then(d=>new Promise((res,rej)=>{
    const r=d.transaction(store,'readwrite').objectStore(store).put(val);
    r.onsuccess=()=>res();r.onerror=e=>rej(e);
  }));
}

// ── State ──────────────────────────────────────────────────────────────────
let songs=[], lists=[], idx=null, audio=null;
let shuffled=false, repeat='none';

async function init(){
  try{ songs=await dbGetAll('songs'); lists=await dbGetAll('playlists'); }
  catch{ songs=[]; lists=[]; }
  // Restore last position
  try{
    const s=await dbGet('state','playstate');
    if(s&&s.idx<songs.length) play(s.idx, s.time||0, s.paused!==false);
  }catch{}
}

function play(i, startTime=0, startPaused=false){
  if(i<0||i>=songs.length)return;
  if(idx===i&&audio&&startTime===0){togglePlay();return;}
  stop();
  idx=i;
  const song=songs[i];
  audio=new Audio(song.url);
  audio.currentTime=startTime;
  if(!startPaused) audio.play().catch(()=>{});
  audio.addEventListener('timeupdate', onTick);
  audio.addEventListener('loadedmetadata',()=>{ document.getElementById('tTotal').textContent=fmt(audio.duration); });
  audio.addEventListener('ended', onEnded);
  updateUI(song,!startPaused);
  updateMS(song);
  saveState();
}

function stop(){
  if(!audio)return;
  audio.pause();
  audio.removeEventListener('timeupdate',onTick);
  audio.removeEventListener('ended',onEnded);
  audio=null;
}

function togglePlay(){
  if(!audio){ if(songs.length)play(0); return; }
  if(audio.paused){ audio.play(); document.getElementById('playBtn').textContent='⏸'; }
  else{ audio.pause(); document.getElementById('playBtn').textContent='▶'; }
  if('mediaSession'in navigator)
    navigator.mediaSession.playbackState=audio.paused?'paused':'playing';
  saveState();
}

function onEnded(){
  if(repeat==='one'){ audio.currentTime=0; audio.play(); return; }
  next();
}

function next(){
  if(!songs.length)return;
  play(shuffled ? Math.floor(Math.random()*songs.length) : ((idx??-1)+1)%songs.length);
}

function prev(){
  if(audio&&audio.currentTime>3){ audio.currentTime=0; return; }
  if(!songs.length)return;
  play(((idx??1)-1+songs.length)%songs.length);
}

function toggleShuffle(){
  shuffled=!shuffled;
  document.getElementById('btnShuffle').classList.toggle('on',shuffled);
}

function toggleRepeat(){
  const m=['none','all','one'],ic=['🔁','🔁','🔂'];
  repeat=m[(m.indexOf(repeat)+1)%3];
  const b=document.getElementById('btnRepeat');
  b.textContent=ic[m.indexOf(repeat)];
  b.classList.toggle('on',repeat!=='none');
}

function onTick(){
  if(!audio)return;
  const p=(audio.currentTime/audio.duration)*100||0;
  document.getElementById('prog').value=p;
  document.getElementById('tNow').textContent=fmt(audio.currentTime);
  if('mediaSession'in navigator&&navigator.mediaSession.setPositionState&&audio.duration){
    try{ navigator.mediaSession.setPositionState({duration:audio.duration,playbackRate:1,position:audio.currentTime}); }catch{}
  }
}

document.getElementById('prog').addEventListener('input',function(){
  if(audio?.duration) audio.currentTime=(this.value/100)*audio.duration;
});

function fmt(s){
  if(!isFinite(s))return'0:00';
  return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}

function updateUI(song, playing=true){
  document.getElementById('titleEl').textContent=song.name;
  document.getElementById('playBtn').textContent=playing?'⏸':'▶';
  const pl=lists.find(p=>p.id===song.playlistId)?.name||'Semua Lagu';
  document.getElementById('subEl').textContent=pl;
  const art=document.getElementById('art');
  if(song.artUrl){ art.innerHTML=`<img src="${song.artUrl}" alt="">`; }
  else{ art.textContent='🎵'; }
}

function updateMS(song){
  if(!('mediaSession'in navigator))return;
  navigator.mediaSession.metadata=new MediaMetadata({
    title:song.name, artist:'Whoop Music',
    album:lists.find(p=>p.id===song.playlistId)?.name||'',
    artwork:song.artUrl?[{src:song.artUrl,sizes:'512x512',type:'image/jpeg'}]:[],
  });
  navigator.mediaSession.playbackState='playing';
  navigator.mediaSession.setActionHandler('play',()=>{audio?.play();document.getElementById('playBtn').textContent='⏸';navigator.mediaSession.playbackState='playing';});
  navigator.mediaSession.setActionHandler('pause',()=>{audio?.pause();document.getElementById('playBtn').textContent='▶';navigator.mediaSession.playbackState='paused';});
  navigator.mediaSession.setActionHandler('nexttrack',next);
  navigator.mediaSession.setActionHandler('previoustrack',prev);
  navigator.mediaSession.setActionHandler('seekto',d=>{if(audio)audio.currentTime=d.seekTime;});
}

function saveState(){
  if(idx===null)return;
  dbPut('state',{key:'playstate',id:'playstate',idx,time:audio?.currentTime||0,paused:audio?.paused??true}).catch(()=>{});
}

window.addEventListener('pagehide',saveState);
window.addEventListener('beforeunload',saveState);

// Messages from music/index.html full page
window.addEventListener('message',e=>{
  if(e.data==='music:next')next();
  if(e.data==='music:prev')prev();
  if(e.data==='music:toggle')togglePlay();
});

init();
</script>
</body>
</html>
