<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Pac-Man</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="hud">
    <button id="btn-back" class="hud-btn">←</button>
    <div class="hg"><span class="hl">SKOR</span><span id="score">0</span></div>
    <div class="hg"><span class="hl">BEST</span><span id="hi">0</span></div>
    <div id="lives">💛💛💛</div>
    <div class="hg"><span class="hl">MAP</span><span id="mapno">1</span></div>
  </header>

  <canvas id="canvas"></canvas>

  <div id="dpad">
    <button class="dp" id="dp-u">▲</button>
    <div class="dp-row">
      <button class="dp" id="dp-l">◀</button>
      <div class="dp-c"></div>
      <button class="dp" id="dp-r">▶</button>
    </div>
    <button class="dp" id="dp-d">▼</button>
  </div>

  <div id="overlay">
    <div id="ov-box">
      <div id="ov-title">PAC-MAN</div>
      <div id="ov-msg">Makan semua titik, hindari hantu!</div>
      <button id="ov-btn">MULAI</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
