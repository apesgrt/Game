<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUNCUR</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <a href="../home.html" class="back">← Kembali</a>

    <div class="title">
      <h1>LUN<span class="dot">C</span>UR</h1>
      <p>Geser Buah · Sejajarkan di Tengah</p>
    </div>

    <div class="scores">
      <div class="score-box" id="score-r">
        <div class="score-dot red"></div>
        <div class="score-label">Merah</div>
        <div class="score-val" id="score-r-val">0</div>
      </div>
      <div class="score-sep">VS</div>
      <div class="score-box" id="score-b">
        <div class="score-dot blue"></div>
        <div class="score-label">Biru</div>
        <div class="score-val" id="score-b-val">0</div>
      </div>
    </div>

    <div class="board-wrap">
      <svg id="board-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <div class="status" id="status"></div>

    <div class="btn-row">
      <button class="btn btn-sec" id="btn-reset-round">↺ Main Lagi</button>
      <button class="btn btn-danger" id="btn-reset-score">Reset Poin</button>
    </div>

    <div class="rules">
      🔴 Mulai bawah &nbsp;·&nbsp; 🔵 Mulai atas<br>
      Menang: sejajar di <b>baris tengah</b> atau <b>diagonal</b>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
