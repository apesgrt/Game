<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <a href="../home.html" class="back">← Kembali</a>

    <div class="title">
      <h1>TIC<span class="dot">·</span>TAC<span class="dot">·</span>TOE</h1>
      <p>Dua Pemain</p>
    </div>

    <div class="scores">
      <div class="score-box" id="score-x">
        <div class="score-label">X</div>
        <div class="score-val" id="score-x-val">0</div>
      </div>
      <div class="score-sep">VS</div>
      <div class="score-box" id="score-o">
        <div class="score-label">O</div>
        <div class="score-val" id="score-o-val">0</div>
      </div>
    </div>

    <div class="status" id="status">Giliran X</div>

    <div class="board" id="board">
      <!-- 9 cells generated by JS -->
    </div>

    <div class="btn-row">
      <button class="btn btn-sec" id="btn-reset-round">↺ Main Lagi</button>
      <button class="btn btn-danger" id="btn-reset-score">Reset Poin</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
