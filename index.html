<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Ualah Cak</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:sans-serif;
}

body{
  background:#07070d;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

/* BACKGROUND */

.bg1,
.bg2{
  position:absolute;
  border-radius:50%;
  filter:blur(120px);
}

.bg1{
  width:350px;
  height:350px;
  background:#5865f2;
  top:-80px;
  left:-80px;
  opacity:0.35;
}

.bg2{
  width:300px;
  height:300px;
  background:#ff00aa;
  bottom:-100px;
  right:-100px;
  opacity:0.2;
}

/* CONTAINER */

.loader{
  z-index:10;
  text-align:center;
  color:white;
  animation:fadeIn 1.5s ease;
}

/* LOGO */

.logo{
  width:130px;
  height:130px;
  border-radius:35px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(15px);

  display:flex;
  justify-content:center;
  align-items:center;

  margin:auto;

  font-size:60px;

  border:1px solid
  rgba(255,255,255,0.1);

  box-shadow:
  0 0 40px rgba(88,101,242,0.3);

  animation:
  float 3s ease-in-out infinite;
}

/* TITLE */

.title{
  margin-top:25px;
  font-size:42px;
  font-weight:bold;
  letter-spacing:2px;
}

.subtitle{
  margin-top:10px;
  color:#aaa;
  font-size:15px;
}

/* LOADING BAR */

.loading-box{
  width:280px;
  height:12px;
  background:rgba(255,255,255,0.08);
  border-radius:30px;
  overflow:hidden;
  margin-top:35px;
  margin-inline:auto;
}

.loading{
  height:100%;
  width:0%;

  background:linear-gradient(
    90deg,
    #5865f2,
    #9b5cff
  );

  border-radius:30px;

  animation:loading 4s forwards;
}

/* TEXT */

.loading-text{
  margin-top:15px;
  color:#bbb;
  font-size:14px;
  letter-spacing:1px;

  animation:blink 1.5s infinite;
}

/* ANIMATION */

@keyframes loading{

  from{
    width:0%;
  }

  to{
    width:100%;
  }

}

@keyframes float{

  0%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-10px);
  }

  100%{
    transform:translateY(0px);
  }

}

@keyframes blink{

  0%{
    opacity:0.4;
  }

  50%{
    opacity:1;
  }

  100%{
    opacity:0.4;
  }

}

@keyframes fadeIn{

  from{
    opacity:0;
    transform:scale(0.95);
  }

  to{
    opacity:1;
    transform:scale(1);
  }

}

/* FADE OUT */

.fade-out{
  animation:fadeOut 1s forwards;
}

@keyframes fadeOut{

  to{
    opacity:0;
    transform:scale(1.05);
  }

}

</style>
</head>
<body>

<div class="bg1"></div>
<div class="bg2"></div>

<div class="loader" id="loader">

  <div class="logo">
    🎮
  </div>

  <div class="title">
    Game Archive
  </div>

  <div class="subtitle">
    Loading, Dagoan hela sabar...
  </div>

  <div class="loading-box">

    <div class="loading"></div>

  </div>

  <div class="loading-text">
    PLEASE WAIT
  </div>

</div>

<script>

setTimeout(()=>{

  document
  .getElementById("loader")
  .classList.add("fade-out");

},3500);

setTimeout(()=>{

  window.location.href =
  "home.html";

},4300);

</script>

</body>
</html>
