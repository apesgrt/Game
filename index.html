<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05050a">
  <title>GameDex Loading</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/loading.css">
  <script src="config/app.config.js"></script>
  <script src="assets/js/core.js"></script>
</head>
<body data-page="Loading">
  <div class="app-bg" aria-hidden="true"></div>
  <div class="stars-twinkle" aria-hidden="true"></div>
  <div class="fx-glow" aria-hidden="true"></div>
  <main class="loader-card" aria-label="Loading GameDex">
    <div class="logo-ring"><img data-app-logo src="assets/images/app-logo.png" alt="GameDex logo"></div>
    <h1 class="title" data-app-name>GameDex</h1>
    <p class="subtitle" data-app-tagline>Mobile Launcher</p>
    <div class="progress-wrap"><div class="progress" id="bar"></div></div>
    <div class="meta"><div class="status" id="status">Menyiapkan launcher</div><div id="percent">0%</div></div>
  </main>
  <script src="assets/js/boot.js"></script>
  <script src="assets/js/loading.js"></script>
</body>
</html>
