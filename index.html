<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Game Archive</title>
<style>
:root{
  --bg:#07070d;
  --panel:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.12);
  --txt:#f8fbff;
  --muted:rgba(255,255,255,.46);
  --a:#5865f2;
  --b:#a855f7;
  --c:#ec4899;
  --d:#06b6d4;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt)}
body{display:grid;place-items:center;position:relative;padding:22px}

.bg-grid{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at center,black 0%,transparent 78%);animation:gridMove 18s linear infinite}
@keyframes gridMove{to{background-position:44px 44px}}
.orb{position:fixed;border-radius:50%;filter:blur(95px);pointer-events:none;opacity:.55;mix-blend-mode:screen;animation:orbFloat 10s ease-in-out infinite}
.o1{width:420px;height:420px;left:-155px;top:-150px;background:radial-gradient(circle,rgba(88,101,242,.65),transparent 68%)}
.o2{width:390px;height:390px;right:-160px;bottom:-120px;background:radial-gradient(circle,rgba(168,85,247,.52),transparent 68%);animation-delay:-3s}
.o3{width:260px;height:260px;left:48%;top:46%;background:radial-gradient(circle,rgba(236,72,153,.32),transparent 72%);animation-delay:-6s}
@keyframes orbFloat{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(22px,-18px,0) scale(1.08)}}
.sweep{position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 0%,transparent 38%,rgba(255,255,255,.035) 48%,transparent 58%,transparent 100%);transform:translateX(-72%);animation:sweep 4.8s cubic-bezier(.22,1,.36,1) infinite}
@keyframes sweep{0%,35%{transform:translateX(-72%)}80%,100%{transform:translateX(72%)}}

.loader{
  width:min(92vw,390px);position:relative;z-index:5;text-align:center;padding:28px 22px 24px;border-radius:34px;
  background:linear-gradient(160deg,#1a1d33 0%,#101323 58%,#180f23 100%);
  border:1px solid rgba(255,255,255,.13);box-shadow:0 30px 100px rgba(0,0,0,.52),inset 0 1px 0 rgba(255,255,255,.06);
  overflow:hidden;animation:cardIn .65s cubic-bezier(.22,1,.36,1) both;
}
.loader::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 10%,rgba(88,101,242,.25),transparent 34%),radial-gradient(circle at 86% 22%,rgba(236,72,153,.16),transparent 34%);pointer-events:none}
.loader::after{content:'';position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent)}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

.logo-stage{position:relative;width:132px;height:132px;margin:2px auto 20px;display:grid;place-items:center}
.logo-stage::before,.logo-stage::after{content:'';position:absolute;inset:0;border-radius:36px;border:1px solid rgba(255,255,255,.11);animation:framePulse 3.2s ease-in-out infinite}
.logo-stage::after{inset:14px;border-color:rgba(88,101,242,.35);animation-delay:-1.6s}
@keyframes framePulse{0%,100%{transform:scale(.96);opacity:.42}50%{transform:scale(1.05);opacity:.9}}
.logo{
  width:94px;height:94px;border-radius:28px;display:grid;place-items:center;font-size:42px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(88,101,242,.98),rgba(168,85,247,.96) 58%,rgba(236,72,153,.9));
  box-shadow:0 18px 55px rgba(88,101,242,.36),0 0 0 1px rgba(255,255,255,.18) inset;
  animation:logoFloat 3s ease-in-out infinite;
}
.logo img{width:100%;height:100%;object-fit:cover;display:block}.logo::after{content:'';position:absolute;inset:-70%;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.48),transparent 65%);transform:translateX(-80%) rotate(14deg);animation:logoShine 2.8s ease-in-out infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes logoShine{0%,45%{transform:translateX(-85%) rotate(14deg)}80%,100%{transform:translateX(85%) rotate(14deg)}}

.title{position:relative;font-size:clamp(28px,8vw,40px);font-weight:950;letter-spacing:-.035em;line-height:1.05;background:linear-gradient(135deg,#fff,#c7d2fe 56%,#f0abfc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 12px 38px rgba(0,0,0,.25)}
.subtitle{position:relative;margin-top:9px;font-size:11px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.34)}

.progress-wrap{position:relative;margin:28px auto 12px;width:min(100%,300px);height:10px;border-radius:999px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.08);overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.progress{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--d),var(--a),var(--b),var(--c));box-shadow:0 0 28px rgba(88,101,242,.45);transition:width .18s cubic-bezier(.22,1,.36,1);position:relative}
.progress::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);animation:barShine 1.15s ease-in-out infinite}
@keyframes barShine{from{transform:translateX(-110%)}to{transform:translateX(110%)}}
.meta{position:relative;display:flex;align-items:center;justify-content:space-between;width:min(100%,300px);margin:0 auto;color:var(--muted);font-size:11px;font-weight:850;letter-spacing:.08em}
.status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;text-transform:uppercase;max-width:210px}.percent{color:rgba(255,255,255,.72)}
.ready .loader{animation:exit .72s cubic-bezier(.22,1,.36,1) forwards}
@keyframes exit{to{opacity:0;transform:scale(1.035);filter:blur(10px)}}
/* NO GLASS: loader tetap keren, tanpa efek kaca/blur panel */
.loader{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:linear-gradient(160deg,#1a1d33 0%,#101323 58%,#180f23 100%)!important}
@keyframes exit{to{opacity:0;transform:scale(1.035)}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.ready .loader{opacity:0}}

html,body{touch-action:manipulation;overscroll-behavior:none;}
</style>
<script>
(function(){
  document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});
  document.addEventListener('gesturechange',function(e){e.preventDefault()},{passive:false});
  document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});
  let lastTouchEnd=0;
  document.addEventListener('touchend',function(e){const now=Date.now();if(now-lastTouchEnd<=330)e.preventDefault();lastTouchEnd=now},{passive:false});
})();
</script>
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>
<div class="orb o1" aria-hidden="true"></div>
<div class="orb o2" aria-hidden="true"></div>
<div class="orb o3" aria-hidden="true"></div>
<div class="sweep" aria-hidden="true"></div>

<main class="loader" id="loader" aria-label="Loading Game Archive">
  <div class="logo-stage" aria-hidden="true">
    <div class="logo"><img src="logo2.png" alt="Game Archive Logo"></div>
  </div>
  <h1 class="title">Game Archive</h1>
  <p class="subtitle">Preparing your hub</p>
  <div class="progress-wrap"><div class="progress" id="bar"></div></div>
  <div class="meta">
    <div class="status" id="status">Menyiapkan tampilan...</div>
    <div class="percent" id="percent">0%</div>
  </div>
</main>

<script>
'use strict';
const bar = document.getElementById('bar');
const statusEl = document.getElementById('status');
const percentEl = document.getElementById('percent');
const messages = [
  'Menyiapkan tampilan...',
  'Merapikan animasi...',
  'Memuat daftar game...',
  'Mengaktifkan musik...',
  'Hampir selesai...',
  'Siap dimainkan!'
];
let progress = 0;
let step = 0;
function setProgress(value){
  progress = Math.min(100, Math.max(progress, value));
  bar.style.width = progress + '%';
  percentEl.textContent = Math.round(progress) + '%';
  const index = Math.min(messages.length - 1, Math.floor(progress / (100 / messages.length)));
  if(index !== step){
    step = index;
    statusEl.textContent = messages[index];
  }
}
const timer = setInterval(()=>{
  const boost = progress < 72 ? 2.6 + Math.random() * 4.2 : 1.1 + Math.random() * 2.2;
  setProgress(progress + boost);
  if(progress >= 100){
    clearInterval(timer);
    statusEl.textContent = 'Siap dimainkan!';
    setTimeout(()=>{
      document.body.classList.add('ready');
      setTimeout(()=>{ window.location.href = 'home.html'; }, 620);
    }, 420);
  }
}, 70);
</script>
</body>
</html>
