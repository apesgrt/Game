<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Game Archive</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#07070d}

body{display:flex;align-items:center;justify-content:center;position:relative}

/* Blobs */
.blob{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;animation:blobFloat 8s ease-in-out infinite}
.b1{width:400px;height:400px;background:radial-gradient(circle,#5865f2,transparent);top:-100px;left:-100px;opacity:.4;animation-delay:0s}
.b2{width:350px;height:350px;background:radial-gradient(circle,#aa00ff,transparent);bottom:-80px;right:-80px;opacity:.3;animation-delay:-3s}
.b3{width:200px;height:200px;background:radial-gradient(circle,#ff0066,transparent);top:40%;left:60%;opacity:.2;animation-delay:-5s}
@keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20px,-20px) scale(1.05)}66%{transform:translate(-15px,15px) scale(.95)}}

/* Particles */
#particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.p{position:absolute;border-radius:50%;animation:pFloat linear infinite}
@keyframes pFloat{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:.5}100%{transform:translateY(-20px) scale(1);opacity:0}}

/* Loader */
.loader{position:relative;z-index:10;text-align:center;display:flex;flex-direction:column;align-items:center;gap:0;animation:fadeIn 1s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Logo */
.logo{
  width:120px;height:120px;border-radius:32px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:center;
  font-size:56px;margin-bottom:28px;
  box-shadow:0 0 60px rgba(88,101,242,.4),0 0 120px rgba(88,101,242,.15);
  animation:logoFloat 3s ease-in-out infinite,logoPulse 3s ease-in-out infinite;
}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes logoPulse{0%,100%{box-shadow:0 0 60px rgba(88,101,242,.4),0 0 120px rgba(88,101,242,.15)}50%{box-shadow:0 0 80px rgba(88,101,242,.6),0 0 160px rgba(88,101,242,.25)}}

/* Title */
.title{font-size:clamp(28px,7vw,42px);font-weight:900;color:#fff;letter-spacing:.08em;margin-bottom:8px;text-shadow:0 0 40px rgba(255,255,255,.3)}
.subtitle{font-size:14px;color:rgba(255,255,255,.4);letter-spacing:.2em;text-transform:uppercase;margin-bottom:36px}

/* Progress */
.bar-wrap{width:260px;height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-bottom:14px;position:relative}
.bar-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
.bar{height:100%;background:linear-gradient(90deg,#5865f2,#a855f7,#ec4899);border-radius:4px;width:0%;transition:width .1s linear}

/* Status */
.status{font-size:12px;color:rgba(255,255,255,.3);letter-spacing:.2em;text-transform:uppercase;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:.9}}

/* Fade out */
.fade-out{animation:fadeOut .8s ease forwards}
@keyframes fadeOut{to{opacity:0;transform:scale(1.03)}}
</style>
</head>
<body>
<div class="b1 blob"></div>
<div class="b2 blob"></div>
<div class="b3 blob"></div>
<div id="particles"></div>

<div class="loader" id="loader">
  <div class="logo">🎮</div>
  <div class="title">Game Archive</div>
  <div class="subtitle">Loading, harap dagoan</div>
  <div class="bar-wrap"><div class="bar" id="bar"></div></div>
  <div class="status" id="status">memuat...</div>
</div>

<script>
// Particles
const wrap = document.getElementById('particles');
for(let i=0;i<25;i++){
  const p=document.createElement('div');p.className='p';
  const size=2+Math.random()*4;
  const colors=['#5865f2','#a855f7','#ec4899','#06b6d4','#10b981'];
  p.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${4+Math.random()*6}s;animation-delay:${Math.random()*4}s;opacity:.6`;
  wrap.appendChild(p);
}

// Progress bar
const bar=document.getElementById('bar');
const status=document.getElementById('status');
const msgs=['Memuat...','Loading assets...','Setting up games...','Semua siap...','Beres!'];
let prog=0;
const iv=setInterval(()=>{
  prog=Math.min(prog+(Math.random()*3+1),100);
  bar.style.width=prog+'%';
  const mi=Math.floor((prog/100)*msgs.length);
  status.textContent=msgs[Math.min(mi,msgs.length-1)];
  if(prog>=100){clearInterval(iv);setTimeout(()=>{document.getElementById('loader').classList.add('fade-out');setTimeout(()=>window.location.href='home.html',800);},400);}
},60);
</script>
</body>
</html>
