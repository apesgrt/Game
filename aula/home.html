<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05050a">
  <title>GameDex Home</title>
  <link rel="icon" type="image/png" href="/logo2.png?v=5">
  <link rel="shortcut icon" type="image/png" href="/logo2.png?v=5">
  <link rel="apple-touch-icon" href="/logo2.png?v=5">
  <meta name="theme-color" content="#05050a">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/home.css">
  <script src="../config/app.config.js"></script>
  <script src="../config/firebase.config.js"></script>
  <script src="../config/rest.config.js"></script>
  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/firebase-adapter.js"></script>
</head>
<body data-page="Home">
  <div class="app-bg" aria-hidden="true"></div>
  <div class="stars-twinkle" aria-hidden="true"></div>
  <div class="fx-glow" aria-hidden="true"></div>

  <div id="maintenanceView" class="hidden"></div>

  <main class="app-shell" id="appShell">
    <header class="topbar">
      <div class="container">
        <nav class="navbar" aria-label="Navigasi utama">
          <a class="brand" href="home.html" aria-label="GameDex Home">
            <img class="brand-logo" data-app-logo src="../assets/images/app-logo.png" alt="GameDex logo">
            <div class="brand-text">
              <div class="brand-title" data-app-name>GameDex</div>
              <div class="brand-subtitle" data-app-subtitle>Mobile Launcher</div>
            </div>
          </a>
          <div class="top-actions">
            <a class="btn btn-ghost btn-icon admin-only" href="settings.html" aria-label="Admin settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.8 1.8 0 0 0-1.98-.36 1.8 1.8 0 0 0-1.1 1.65V21a2 2 0 0 1-4 0v-.09a1.8 1.8 0 0 0-1.1-1.65 1.8 1.8 0 0 0-1.98.36l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.8 1.8 0 0 0 4.6 15a1.8 1.8 0 0 0-1.65-1.1H3a2 2 0 0 1 0-4h.09A1.8 1.8 0 0 0 4.74 8.8a1.8 1.8 0 0 0-.36-1.98l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.8 1.8 0 0 0 1.98.36H9.2A1.8 1.8 0 0 0 10.3 2.7V3a2 2 0 0 1 4 0v-.09a1.8 1.8 0 0 0 1.1 1.65 1.8 1.8 0 0 0 1.98-.36l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.8 1.8 0 0 0-.36 1.98v.01a1.8 1.8 0 0 0 1.65 1.1H21a2 2 0 0 1 0 4h-.09A1.8 1.8 0 0 0 19.4 15Z"/></svg>
            </a>
            <button class="hamburger" id="menuBtn" type="button" aria-label="Buka menu" aria-expanded="false">
              <span class="hamburger-lines" aria-hidden="true"><span></span><span></span><span></span></span>
            </button>
          </div>
        </nav>
      </div>
    </header>

    <aside class="menu-panel" id="menuPanel" aria-hidden="true">
      <a class="menu-link" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><span>Home</span></a>
      <a class="menu-link" href="#games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="6" width="18" height="12" rx="4"/><path d="M8 12h4M10 10v4M16 11h.01M18 13h.01"/></svg><span>Games</span></a>
      <a class="menu-link" id="profileMenuLink" href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg><span>Profile</span></a>
      <a class="menu-link" href="login.html" id="loginMenuLink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg><span id="loginMenuText">Login</span></a>
      <a class="menu-link admin-menu-link" href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 20h16"/><path d="M6 16V8l6-4 6 4v8"/><path d="M9 20v-6h6v6"/></svg><span>Admin Panel</span></a>
    </aside>

    <section class="container main-content">
      <section class="account-card" aria-label="Akun">
        <div class="account-main">
          <div class="avatar" id="avatar" aria-label="Avatar akun"><span class="initial">G</span></div>
          <div class="account-info">
            <div class="account-kicker">Account <span class="chip chip-green hidden" id="roleBadge">Admin</span></div>
            <div class="account-name" id="profileName">Guest</div>
            <div class="account-user" id="profileUser">@guest</div>
          </div>
        </div>
        <div class="account-actions">
          <a class="btn btn-ghost btn-account" id="editProfileBtn" href="profile.html">EDIT PROFILE</a>
          <a class="btn btn-purple btn-account" id="authBtn" href="login.html">LOGIN</a>
        </div>
      </section>

      <section class="global-card" aria-label="Pesan global">
        <div class="global-inner">
          <div class="global-kicker">Info</div>
          <h1 class="global-title" id="welcomeTitle">Selamat datang di GameDex</h1>
          <p class="global-text" id="welcomeText">Pilih game favorit kamu.</p>
          <div class="announcement" id="announcementBox"></div>
        </div>
      </section>

      <div class="section-head" id="games">
        <div>
          <h2>Games</h2>
          <p>Tombol launcher saja, game belum disambungkan.</p>
        </div>
        <span class="chip" id="gameCount">0 GAME</span>
      </div>

      <div class="games-list" id="gamesList"></div>

      <div class="section-head" id="tools">
        <div>
          <h2>Tools</h2>
          <p>Fitur tambahan GameDex.</p>
        </div>
        <span class="chip" id="toolCount">0 TOOLS</span>
      </div>

      <div class="games-list tools-list" id="toolsList"></div>

      <p class="footer-note" id="footerNote">GameDex Base Rebuild</p>
    </section>
  </main>



  <!-- Music iframe layer: dibuat dari awal supaya musik tidak gagal dibuka dan tidak reset saat ditutup -->
  <div id="music-bar" aria-hidden="true">
    <iframe
      id="music-iframe"
      title="GameDex Music Player"
      src="../tools/music/musik.html"
      allow="autoplay *; clipboard-write; fullscreen"
      allowfullscreen>
    </iframe>
  </div>



  <!-- Game iframe layer: tanpa tombol back tambahan. Game sendiri yang menutup via postMessage. -->
  <div id="game-frame-layer" class="game-frame-layer" aria-hidden="true">
    <iframe
      id="game-frame"
      class="game-frame"
      title="GameDex Game Frame"
      src="../game/spy/spy.html"
      data-current-game="spy"
      allow="autoplay *; clipboard-write; fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <div class="toast" id="toast"></div>
  <script src="../assets/js/boot.js"></script>
  <script src="../assets/js/home.js"></script>
</body>
</html>
