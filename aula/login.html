<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05050a">
  <title>GameDex Login</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/login.css">
  <script src="../config/app.config.js"></script>
  <script src="../config/firebase.config.js"></script>
  <script src="../config/rest.config.js"></script>
  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/firebase-adapter.js"></script>
</head>
<body data-page="Login">
  <div class="app-bg" aria-hidden="true"></div>
  <div class="stars-twinkle" aria-hidden="true"></div>
  <div class="fx-glow" aria-hidden="true"></div>
  <main class="auth-card">
    <section class="auth-inner">
      <div class="auth-logo">
        <img data-app-logo src="../assets/images/app-logo.png" alt="GameDex logo">
        <div class="auth-brand"><span data-app-name>GameDex</span><small data-app-subtitle>Mobile Launcher</small></div>
      </div>
      <hr class="hairline">
      <h1 class="auth-title" id="authTitle">Login Account</h1>
      <p class="auth-desc" id="authDesc">Admin tidak punya tombol khusus. Kalau email yang login ada di daftar admin Firebase, panel admin akan terbuka otomatis.</p>

      <button class="google-btn" type="button" id="googleBtn" onclick="loginWithGoogle()" aria-label="Login dengan Google">
        <span class="google-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.1 0 9.8-1.9 13.3-5.1l-6.1-5.2C29.2 35.2 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.4 39.5 16.1 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.7l6.1 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        </span>
        <span>Continue with Google</span>
      </button>

      <div class="divider"><span>atau pakai email</span></div>

      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" type="button" id="tabLogin" onclick="setMode('login')">LOGIN</button>
        <button class="auth-tab" type="button" id="tabRegister" onclick="setMode('register')">REGISTER</button>
      </div>

      <form class="form" id="authForm">
        <div class="form-group" id="nameGroup">
          <label class="label" for="nameInput">Nama</label>
          <input class="input" id="nameInput" autocomplete="name" placeholder="Nama kamu">
        </div>
        <div class="form-group" id="emailGroup">
          <label class="label" for="emailInput">Email</label>
          <input class="input" id="emailInput" type="email" autocomplete="email" placeholder="email@example.com">
        </div>
        <div class="form-group" id="passwordGroup">
          <label class="label" for="passwordInput">Password</label>
          <div class="password-wrap">
            <input class="input" id="passwordInput" type="password" autocomplete="current-password" placeholder="Minimal 6 karakter">
            <button class="show-pass" type="button" onclick="togglePassword()">SHOW</button>
          </div>
        </div>
        <button class="btn btn-purple" type="submit" id="submitBtn">LOGIN</button>
      </form>
      <div class="admin-hint" id="adminHint">Admin auto-detect dari email Firebase yang ada di config.</div>
      <div class="message" id="message"></div>
      <p class="auth-footer"><a href="home.html">Kembali ke Home</a></p>
    </section>
  </main>
  <script src="../assets/js/boot.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
